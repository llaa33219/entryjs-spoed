[package]
name = "entry_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Entry WASM Engine"]
description = "High-performance WASM execution engine for Entry projects"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Window"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Note: panic = "abort" removed to allow proper error handling in WASM
# This allows panics to unwind properly and show useful error messages
