[package]
name = "entry_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Entry WASM Engine"]
description = "High-performance WASM execution engine for Entry projects"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "Window"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = { version = "0.1", optional = true }
rustc-hash = "2.0"
smallvec = { version = "1.13", features = ["union", "const_generics"] }
compact_str = "0.8"
phf = { version = "0.11", features = ["macros"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
debug = false
incremental = false
rpath = false

[profile.release.package."*"]
opt-level = 3

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-simd", "--enable-mutable-globals", "--fast-math", "--converge"]
