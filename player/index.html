                            brushState.fillPath.push({ x: screenX, y: screenY });
                        }
                    }
                    this.drawPixiFillPreview(entityKey);
                }

                drawPixiFillPreview(entityKey) {
                    const brushState = this.brushStates.get(entityKey);
                    if (!brushState || !brushState.fillDown || brushState.fillPath.length < 3) {
                        return;
                    }

                    this.fillGraphics.clear();

                    const color = parseInt(brushState.fillColor.replace('#', ''), 16) || 0xff0000;
                    this.fillGraphics.beginFill(color);

                    this.fillGraphics.moveTo(brushState.fillPath[0].x, brushState.fillPath[0].y);

                    for (let i = 1; i < brushState.fillPath.length; i++) {
                        this.fillGraphics.lineTo(
                            brushState.fillPath[i].x,
                            brushState.fillPath[i].y
                        );
                    }

                    this.fillGraphics.closePath();
                    this.fillGraphics.endFill();
                }

                updateBrushDrawing(entities) {
                    for (const entity of entities) {
                        const entityKey = entity.id;
                        const brushState = this.getBrushState(entityKey);

                        const wasBrushDown = brushState.down;
                        brushState.down = entity.brushDown || false;
                        brushState.color = entity.brushColor || brushState.color;
                        brushState.size = entity.brushSize || brushState.size;

                        if (!wasBrushDown && brushState.down) {
                            brushState.lastX = null;
                            brushState.lastY = null;
                        }

                        const screenX = 240 + entity.x;
                        const screenY = 180 - entity.y;

                        if (brushState.fillDown) {
                            const lastPoint = brushState.fillPath[brushState.fillPath.length - 1];
                            let pointAdded = false;
                            if (lastPoint) {
                                const dx = screenX - lastPoint.x;
                                const dy = screenY - lastPoint.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance >= 2) {
                                    brushState.fillPath.push({ x: screenX, y: screenY });
                                    pointAdded = true;
                                }
                            } else {
                                brushState.fillPath.push({ x: screenX, y: screenY });
                                pointAdded = true;
                            }
                            if (pointAdded) {
                                this.drawPixiFillPreview(entityKey);
                            }
                        }

                        if (!brushState.down) {
                            brushState.lastX = null;
                            brushState.lastY = null;
                            continue;
                        }

                        if (brushState.lastX !== null && brushState.lastY !== null) {
                            const gfx = this.getBrushGraphics(entityKey);
                            const color =
                                parseInt(brushState.color.replace('#', ''), 16) || 0x000000;
                            const alpha = 1 - brushState.opacity / 100;
                            gfx.lineStyle(brushState.size, color, alpha);
                            gfx.moveTo(brushState.lastX, brushState.lastY);
                            gfx.lineTo(screenX, screenY);
                        }

                        brushState.lastX = screenX;
                        brushState.lastY = screenY;
                    }
                }

                render() {
                    if (this.isWasmEngineValid()) {
                        try {
                            const ptr = this.wasmEngine.get_render_buffer_ptr();
                            const len = this.wasmEngine.get_render_buffer_len();

                            if (ptr && len > 0 && this.wasmMemory) {
                                if (!this._firstRenderLogged) {
                                    this._firstRenderLogged = true;
                                    const rendererType =
                                        this.pixiApp.renderer.type === PIXI.RENDERER_TYPE.WEBGL
                                            ? 'WebGL'
                                            : 'Canvas';
                                    console.log(
                                        `%c✨ PixiJS ${rendererType} 렌더링 시작 (ptr: ${ptr}, len: ${len})`,
                                        'color: #00ff00; font-weight: bold;'
                                    );
                                }

                                const buffer = new Float64Array(this.wasmMemory.buffer, ptr, len);
                                this.updatePixiSprites(buffer);
                                this._renderErrorCount = 0;
                            }
                        } catch (e) {
                            this._renderErrorCount = (this._renderErrorCount || 0) + 1;
                            if (!this._renderDataErrorLogged) {
                                this._renderDataErrorLogged = true;
                                console.warn('Render error:', e);
                            }
                            if (this._renderErrorCount >= 5) {
                                console.error('PixiJS render 연속 실패');
                                this.wasmEngine = null;
                                this.wasmInitialized = false;
                                if (!this.jsEngine && this.projectData?.objects) {
                                    const objects =
                                        typeof this.projectData.objects === 'string'
                                            ? JSON.parse(this.projectData.objects)
                                            : this.projectData.objects;
                                    this.initJSEngine(objects);
                                }
                            }
                        }
                    } else if (this.jsEngine) {
                        this.drawJSEngine();
                    }
                }

                updatePixiSprites(buffer) {
                    if (this.needsGarbageCollection) {
                        const livingIds = new Set();
                        for (let i = 0; i < buffer.length; i += RENDER_STRIDE) {
                            livingIds.add(buffer[i]);
                        }

                        for (const [id, _] of this.brushGraphics) {
                            if (!livingIds.has(id)) {
                                const gfx = this.brushGraphics.get(id);
                                if (gfx && gfx.parent) gfx.parent.removeChild(gfx);
                                this.brushGraphics.delete(id);
                                this.brushStates.delete(id);
                                this.dialogs.delete(id);
                            }
                        }

                        for (const [id, sprite] of this.pixiSprites) {
                            if (!livingIds.has(id)) {
                                if (sprite.parent) sprite.parent.removeChild(sprite);
                                this.pixiSprites.delete(id);
                            }
                        }

                        this.entityOrder = this.entityOrder.filter((id) => livingIds.has(id));
                        this.needsGarbageCollection = false;
                    }

                    const entityMap = new Map();
                    const len = buffer.length;
                    const existingIds = new Set(this.entityOrder);

                    for (let i = 0; i < len; i += RENDER_STRIDE) {
                        const id = buffer[i];
                        entityMap.set(id, i);
                        if (!existingIds.has(id)) {
                            this.entityOrder.push(id);
                        }
                    }

                    for (let i = 0; i < len; i += RENDER_STRIDE) {
                        const id = buffer[i];
                        const brushDown = buffer[i + 10] > 0.5;
                        const brushSize = buffer[i + 11];
                        const brushTransparency = buffer[i + 12];
                        const fillDown = buffer[i + 13] > 0.5;

                        const brushState = this.getBrushState(id);
                        brushState.down = brushDown;
                        brushState.size = brushSize;
                        brushState.opacity = brushTransparency;
                        brushState.fillDown = fillDown;
                    }

                    this.entityContainer.removeChildren();
                    this.dialogContainer.removeChildren();

                    for (let i = 0; i < this.entityOrder.length; i++) {
                        const entityId = this.entityOrder[i];
                        const offset = entityMap.get(entityId);

                        const brushGfx = this.brushGraphics.get(entityId);
                        if (brushGfx) {
                            this.entityContainer.addChild(brushGfx);
                        }

                        if (offset !== undefined) {
                            this.updateEntitySprite(buffer, offset, entityId);
                        }
                    }
                }

                updateEntitySprite(buffer, offset, entityId) {
                    const x = buffer[offset + 1];
                    const y = buffer[offset + 2];
                    const rotation = buffer[offset + 3];
                    const scaleX = buffer[offset + 5];
                    const scaleY = buffer[offset + 6];
                    const width = buffer[offset + 7];
                    const height = buffer[offset + 8];
                    const visible = buffer[offset + 9] > 0.5;
                    const pictureIndex = buffer[offset + 15];

                    if (!visible) return;

                    let sprite = this.pixiSprites.get(entityId);
                    const entityObj = this.findObjectById(entityId);
                    const textEntity = this.textEntities.get(entityId);

                    let pictureId = null;
                    if (entityObj && entityObj.sprite?.pictures && pictureIndex >= 0) {
                        const pic = entityObj.sprite.pictures[Math.floor(pictureIndex)];
                        if (pic) pictureId = pic.id;
                    }
                    if (!pictureId && entityObj) {
                        pictureId = entityObj.selectedPictureId;
                    }

                    let texture = pictureId ? this.getOrCreateTexture(pictureId) : null;

                    if (!sprite) {
                        sprite = texture
                            ? new PIXI.Sprite(texture)
                            : new PIXI.Sprite(PIXI.Texture.WHITE);
                        sprite.anchor.set(0.5);
                        this.pixiSprites.set(entityId, sprite);
                    } else if (texture && sprite.texture !== texture) {
                        sprite.texture = texture;
                    }

                    sprite.x = 240 + x;
                    sprite.y = 180 - y;
                    sprite.rotation = (-rotation * Math.PI) / 180;
                    sprite.scale.set(scaleX, scaleY);
                    sprite.width = width * scaleX;
                    sprite.height = height * scaleY;
                    sprite.visible = true;

                    if (!texture) {
                        sprite.tint = 0x4a90d9;
                        sprite.width = width * scaleX;
                        sprite.height = height * scaleY;
                    }

                    this.entityContainer.addChild(sprite);

                    if (textEntity && textEntity.text) {
                        this.renderPixiText(entityId, textEntity, sprite);
                    }

                    const dialog = this.dialogs.get(entityId);
                    if (dialog) {
                        this.renderPixiDialog(entityId, x, y, width, height, dialog);
                    }
                }

                getOrCreateTexture(pictureId) {
                    if (this.pixiTextures.has(pictureId)) {
                        return this.pixiTextures.get(pictureId);
                    }

                    const img = imageCache.get(pictureId);
                    if (img && img.complete && img.naturalWidth > 0) {
                        const texture = PIXI.Texture.from(img);
                        this.pixiTextures.set(pictureId, texture);
                        return texture;
                    }

                    return null;
                }

                renderPixiText(entityId, textEntity, parentSprite) {
                    const textKey = `text_${entityId}`;
                    let pixiText = this.pixiSprites.get(textKey);

                    const style = new PIXI.TextStyle({
                        fontFamily: textEntity.font || 'Nanum Gothic',
                        fontSize: 20,
                        fill: textEntity.colour || '#000000',
                        align:
                            textEntity.textAlign === 1
                                ? 'center'
                                : textEntity.textAlign === 2
                                  ? 'right'
                                  : 'left',
                        wordWrap: textEntity.lineBreak,
                        wordWrapWidth: parentSprite.width,
                    });

                    if (!pixiText) {
                        pixiText = new PIXI.Text(textEntity.text, style);
                        pixiText.anchor.set(0.5);
                        this.pixiSprites.set(textKey, pixiText);
                    } else {
                        pixiText.text = textEntity.text;
                        pixiText.style = style;
                    }

                    pixiText.x = parentSprite.x;
                    pixiText.y = parentSprite.y;
                    this.entityContainer.addChild(pixiText);
                }

                renderPixiDialog(entityId, x, y, width, height, dialog) {
                    const dialogKey = `dialog_${entityId}`;
                    let dialogContainer = this.pixiSprites.get(dialogKey);

                    if (!dialogContainer) {
                        dialogContainer = new PIXI.Container();
                        this.pixiSprites.set(dialogKey, dialogContainer);
                    }

                    dialogContainer.removeChildren();

                    const screenX = 240 + x;
                    const screenY = 180 - y;
                    const entityHalfHeight = height / 2;

                    const style = new PIXI.TextStyle({
                        fontFamily: 'Noto Sans KR, sans-serif',
                        fontSize: 14,
                        fill: '#000000',
                    });

                    const textMetrics = PIXI.TextMetrics.measureText(dialog.message, style);
                    const padding = 12;
                    const balloonWidth = textMetrics.width + padding * 2;
                    const balloonHeight = textMetrics.height + padding * 2;

                    let balloonX = screenX - balloonWidth / 2;
                    let balloonY = screenY - entityHalfHeight - balloonHeight - 20;

                    balloonX = Math.max(5, Math.min(480 - balloonWidth - 5, balloonX));
                    if (balloonY < 5) balloonY = screenY + entityHalfHeight + 20;
                    if (balloonY + balloonHeight > 355) balloonY = 355 - balloonHeight;

                    const gfx = new PIXI.Graphics();
                    gfx.lineStyle(2, 0x000000);
                    gfx.beginFill(0xffffff);
                    gfx.drawRoundedRect(balloonX, balloonY, balloonWidth, balloonHeight, 10);
                    gfx.endFill();

                    const text = new PIXI.Text(dialog.message, style);
                    text.x = balloonX + balloonWidth / 2;
                    text.y = balloonY + balloonHeight / 2;
                    text.anchor.set(0.5);

                    dialogContainer.addChild(gfx);
                    dialogContainer.addChild(text);
                    this.dialogContainer.addChild(dialogContainer);
                }

                findObjectById(entityId) {
                    // WASM engine loads only current scene's objects with indices 0 to N
                    // So we must look up from current scene's objects, not allObjects
                    const sceneObjects = this.getCurrentSceneObjects();
                    return sceneObjects[entityId];
                }

                // Preload sprite images
                async preloadImages() {
                    if (!this.projectData?.objects) return;

                    const objects =
                        typeof this.projectData.objects === 'string'
                            ? JSON.parse(this.projectData.objects)
                            : this.projectData.objects;

                    const loadPromises = [];

                    for (const obj of objects) {
                        if (obj.sprite?.pictures) {
                            for (const pic of obj.sprite.pictures) {
                                if (pic.fileurl || pic.filename) {
                                    // 원본 URL 생성
                                    let originalUrl = pic.fileurl;
                                    if (!originalUrl && pic.filename) {
                                        originalUrl = `uploads/${pic.filename.substring(0, 2)}/${pic.filename.substring(2, 4)}/image/${pic.filename}.png`;
                                    }

                                    // 프록시 URL로 변환 (playentry.org 직접 접근 대신 우리 서버 프록시 사용)
                                    let proxyUrl;
                                    if (
                                        originalUrl.startsWith('http://') ||
                                        originalUrl.startsWith('https://')
                                    ) {
                                        // 절대 URL인 경우 playentry.org 부분을 프록시로 교체
                                        proxyUrl = originalUrl
                                            .replace(
                                                'https://playentry.org/',
                                                '/api/playentry/image/'
                                            )
                                            .replace(
                                                'http://playentry.org/',
                                                '/api/playentry/image/'
                                            );
                                    } else {
                                        // 상대 URL인 경우
                                        proxyUrl = `/api/playentry/image/${originalUrl}`;
                                    }

                                    console.log(`이미지 로드: ${pic.id} -> ${proxyUrl}`);

                                    const img = new Image();

                                    // 이미지 로드 Promise 생성
                                    const loadPromise = new Promise((resolve, reject) => {
                                        img.onload = () => {
                                            console.log(`이미지 로드 완료: ${pic.id}`);
                                            resolve(pic.id);
                                        };
                                        img.onerror = (e) => {
                                            console.warn(
                                                `이미지 로드 실패: ${pic.id} - ${proxyUrl}`,
                                                e
                                            );
                                            reject(new Error(`이미지 로드 실패: ${pic.id}`));
                                        };
                                    });

                                    img.src = proxyUrl;
                                    imageCache.set(pic.id, img);
                                    loadPromises.push(loadPromise.catch(() => null)); // 실패해도 계속 진행
                                }
                            }
                        }
                    }

                    // 모든 이미지 로드 대기 (최대 10초)
                    if (loadPromises.length > 0) {
                        console.log(`${loadPromises.length}개 이미지 로드 대기 중...`);
                        await Promise.race([
                            Promise.all(loadPromises),
                            new Promise((resolve) => setTimeout(resolve, 10000)), // 10초 타임아웃
                        ]);
                        console.log('이미지 로드 완료 또는 타임아웃');
                    }
                }

                drawJSEngine() {
                    if (!this.jsEngineText) {
                        const titleStyle = new PIXI.TextStyle({
                            fontFamily: 'sans-serif',
                            fontSize: 20,
                            fill: '#4a90d9',
                        });
                        const subtitleStyle = new PIXI.TextStyle({
                            fontFamily: 'sans-serif',
                            fontSize: 14,
                            fill: '#666666',
                        });

                        this.jsEngineText = new PIXI.Container();

                        const title = new PIXI.Text(
                            this.projectData?.name || 'Entry Project',
                            titleStyle
                        );
                        title.anchor.set(0.5);
                        title.x = 240;
                        title.y = 180;

                        const subtitle = new PIXI.Text('WASM 엔진 로딩 중...', subtitleStyle);
                        subtitle.anchor.set(0.5);
                        subtitle.x = 240;
                        subtitle.y = 210;

                        this.jsEngineText.addChild(title);
                        this.jsEngineText.addChild(subtitle);
                        this.pixiApp.stage.addChild(this.jsEngineText);
                    }
                }

                setupControls() {
                    document
                        .getElementById('btn-play')
                        .addEventListener('click', () => this.toggle());
                    document
                        .getElementById('btn-restart')
                        .addEventListener('click', () => this.restart());
                    document.getElementById('btn-fullscreen').addEventListener('click', () => {
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else {
                            document.documentElement.requestFullscreen();
                        }
                    });

                    // Keyboard controls
                    document.addEventListener('keydown', (e) => {
                        if (e.code === 'Space') {
                            e.preventDefault();
                            this.toggle();
                        } else if (e.code === 'KeyR') {
                            this.restart();
                        } else if (e.code === 'KeyF') {
                            document.documentElement.requestFullscreen();
                        }
                    });

                    // Mouse tracking for WASM engine
                    this.canvas.addEventListener('mousemove', (e) => {
                        this.updateMousePosition(e);
                    });

                    this.canvas.addEventListener('mousedown', (e) => {
                        this.mouseClicked = true;
                        this.updateMousePosition(e);

                        if (this.isWasmEngineValid()) {
                            // Update mouse position in WASM before firing click event
                            // This ensures the click happens at the correct coordinates
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_clicked();
                            } catch (err) {
                                console.warn('WASM mouse click error:', err);
                            }
                        }
                    });

                    this.canvas.addEventListener('mouseup', (e) => {
                        this.mouseClicked = false;
                        this.updateMousePosition(e);

                        if (this.isWasmEngineValid()) {
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_click_cancled();
                            } catch (err) {
                                console.warn('WASM mouse release error:', err);
                            }
                        }
                    });

                    this.canvas.addEventListener('mouseleave', (e) => {
                        this.mouseClicked = false;
                    });

                    // Touch support for mobile
                    this.canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.mouseClicked = true;
                        if (e.touches.length > 0) {
                            this.updateTouchPosition(e.touches[0]);
                        }

                        if (this.isWasmEngineValid()) {
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_clicked();
                            } catch (err) {
                                console.warn('WASM touch start error:', err);
                            }
                        }
                    });

                    this.canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        if (e.touches.length > 0) {
                            this.updateTouchPosition(e.touches[0]);
                        }
                    });

                    this.canvas.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.mouseClicked = false;

                        if (this.isWasmEngineValid()) {
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_click_cancled();
                            } catch (err) {
                                console.warn('WASM touch end error:', err);
                            }
                        }
                    });
                }

                // Convert mouse event to Entry coordinates
                updateMousePosition(e) {
                    const rect = this.canvas.getBoundingClientRect();
                    const canvasX = e.clientX - rect.left;
                    const canvasY = e.clientY - rect.top;

                    // Convert to Entry coordinate system:
                    // Canvas (0,0) to (480,360) -> Entry (-240,180) to (240,-180)
                    this.mouseX = (canvasX / rect.width) * 480 - 240;
                    this.mouseY = 180 - (canvasY / rect.height) * 360;
                }

                // Convert touch event to Entry coordinates
                updateTouchPosition(touch) {
                    const rect = this.canvas.getBoundingClientRect();
                    const canvasX = touch.clientX - rect.left;
                    const canvasY = touch.clientY - rect.top;

                    this.mouseX = (canvasX / rect.width) * 480 - 240;
                    this.mouseY = 180 - (canvasY / rect.height) * 360;
                }

                updateProgress(percent, text) {
                    document.getElementById('loading-progress-bar').style.width = percent + '%';
                    document.getElementById('loading-text').textContent = text;
                }

                hideLoading() {
                    document.getElementById('loading').classList.add('hidden');
                }

                showError(message) {
                    const errorDiv = document.getElementById('error');
                    errorDiv.textContent = message;
                    errorDiv.style.display = 'block';
                    document.getElementById('loading').classList.add('hidden');
                }

                // 에러 객체를 문자열로 포맷팅
                formatError(error) {
                    if (!error) return '알 수 없는 에러 (null)';
                    if (typeof error === 'string') return error;
                    if (error.message) return error.message;
                    if (error.toString && error.toString() !== '[object Object]')
                        return error.toString();
                    try {
                        return JSON.stringify(error);
                    } catch (e) {
                        return '에러 객체를 문자열로 변환할 수 없음';
                    }
                }
            }

            // Start player
            const player = new EntryPlayer();
            player.initialize();
        </script>
    </body>
