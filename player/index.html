<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entry Player (WASM)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Noto Sans KR', sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #loading-text {
            color: #fff;
            margin-top: 20px;
            font-size: 18px;
            text-shadow: 0 2px 10px rgba(0, 212, 255, 0.5);
        }
        
        #loading-progress {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        #loading-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
            transition: width 0.3s ease;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        
        #entryCanvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        #error {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 50, 50, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 2000;
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #canvas-container:hover #controls {
            opacity: 1;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
        
        .control-btn.active {
            background: #00d4ff;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">프로젝트 로딩 중...</div>
        <div id="loading-progress">
            <div id="loading-progress-bar"></div>
        </div>
    </div>
    
    <div id="error"></div>
    
    <div id="canvas-container">
        <canvas id="entryCanvas" width="480" height="360"></canvas>
        <div id="controls">
            <button class="control-btn" id="btn-play" title="시작/정지">▶</button>
            <button class="control-btn" id="btn-restart" title="다시 시작">↺</button>
            <button class="control-btn" id="btn-fullscreen" title="전체화면">⛶</button>
        </div>
    </div>

    <!-- WASM Engine -->
    <script type="module">
        import init, { WasmEngine } from './wasm/entry_wasm.js';
        
        // Image cache for sprites
        const imageCache = new Map();
        
        class EntryPlayer {
            constructor() {
                this.projectId = null;
                this.projectData = null;
                this.wasmEngine = null;
                this.canvas = document.getElementById('entryCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.isRunning = false;
                this.animationId = null;
            }
            
            async initialize() {
                this.updateProgress(10, 'WASM 엔진 초기화 중...');
                
                try {
                    // Initialize WASM
                    await init();
                    this.wasmEngine = new WasmEngine();
                    this.updateProgress(30, 'WASM 엔진 준비 완료');
                } catch (e) {
                    console.warn('WASM 로드 실패, JS 폴백 사용:', e);
                    // Fallback to JS engine
                }
                
                // Get project ID from URL
                const params = new URLSearchParams(window.location.search);
                this.projectId = params.get('id');
                
                if (!this.projectId) {
                    this.showError('프로젝트 ID가 필요합니다. URL에 ?id=프로젝트ID 형식으로 입력해주세요.');
                    return;
                }
                
                this.updateProgress(40, '프로젝트 데이터 로딩 중...');
                
                try {
                    await this.loadProject();
                    this.updateProgress(80, '프로젝트 초기화 중...');
                    await this.initializeProject();
                    this.updateProgress(90, '이미지 로딩 중...');
                    await this.preloadImages();
                    this.updateProgress(100, '완료!');
                    
                    setTimeout(() => {
                        this.hideLoading();
                        this.start();
                    }, 500);
                } catch (error) {
                    this.showError('프로젝트 로딩 실패: ' + error.message);
                }
                
                this.setupControls();
            }
            
            async loadProject() {
                try {
                    // Step 1: Fetch CSRF token and cookie from playentry.org
                    this.updateProgress(45, 'CSRF 토큰 획득 중...');
                    this.entryCookie = '';  // 쿠키 초기화
                    const csrfToken = await this.getSessionData();
                    
                    if (!csrfToken) {
                        console.warn('CSRF 토큰을 획득하지 못했습니다. 요청이 실패할 수 있습니다.');
                    }
                    
                    // Step 2: Fetch project data via GraphQL
                    this.updateProgress(55, 'GraphQL 데이터 요청 중...');
                    this.projectData = await this.fetchProjectData(csrfToken);
                    
                    // Step 3: Validate project data
                    this.updateProgress(70, '프로젝트 데이터 검증 중...');
                    if (!this.projectData) {
                        throw new Error('프로젝트 데이터가 null/undefined입니다');
                    }
                    
                    if (typeof this.projectData !== 'object') {
                        throw new Error(`프로젝트 데이터 타입이 잘못됨: ${typeof this.projectData}`);
                    }
                    
                    if (!this.projectData.id) {
                        throw new Error(`프로젝트 ID가 없습니다. 받은 데이터: ${JSON.stringify(this.projectData).substring(0, 200)}`);
                    }
                    
                    console.log('프로젝트 로드 성공:', this.projectData.name, 'ID:', this.projectData.id);
                    
                } catch (error) {
                    console.error('loadProject 에러:', error);
                    throw error;
                }
            }
            
            async getSessionData() {
                try {
                    // Try to get CSRF token and cookie from the page via server proxy
                    const response = await fetch(`/api/playentry/iframe/${this.projectId}`);
                    
                    // 서버에서 캐치한 쿠키 가져오기
                    const entryCookie = response.headers.get('X-Entry-Cookie') || '';
                    if (entryCookie) {
                        console.log('쿠키 획득 성공:', entryCookie.substring(0, 30) + '...');
                        this.entryCookie = entryCookie;
                    }
                    
                    const html = await response.text();
                    
                    // Extract CSRF token from meta tag: <meta name="csrf-token" content="..."/>
                    const csrfMatch = html.match(/<meta\s+name=["']csrf-token["']\s+content=["']([^"']+)["']/i);
                    
                    if (csrfMatch) {
                        console.log('CSRF 토큰 획득 성공:', csrfMatch[1].substring(0, 10) + '...');
                        return csrfMatch[1];
                    }
                    
                    // Fallback: try other patterns
                    const altMatch = html.match(/csrf['"]?\s*[:\s]+\s*['"]([^'"]+)['"]/i);
                    if (altMatch) {
                        console.log('CSRF 토큰 (대체 패턴):', altMatch[1].substring(0, 10) + '...');
                        return altMatch[1];
                    }
                    
                    console.warn('CSRF 토큰을 찾을 수 없음');
                    return '';
                } catch (e) {
                    console.warn('CSRF 토큰 획득 실패:', e);
                    return '';
                }
            }
            
            async fetchProjectData(csrfToken) {
                const query = `
    query SELECT_PROJECT($id: ID! $groupId: ID) {
        project(id: $id, groupId: $groupId) {
            
    
    id
    name
    user {
        
    id
    nickname
    profileImage {
        
    id
    name
    label {
        
    ko
    en
    ja
    vn

    }
    filename
    imageType
    dimension {
        
    width
    height

    }
    trimmed {
        filename
        width
        height
    }

    }
    status {
        following
        follower
    }
    description
    role
    mark {
        
    id
    name
    label {
        
    ko
    en
    ja
    vn

    }
    filename
    imageType
    dimension {
        
    width
    height

    }
    trimmed {
        filename
        width
        height
    }
 
    }

    }
    thumb
    isopen
    showComment
    blamed
    isPracticalCourse
    category
    categoryCode
    created
    updated
    special
    isForLecture
    isForStudy
    isForSubmit
    hashId
    complexity
    staffPicked
    ranked
    visit
    likeCnt
    comment
    favorite
    shortenUrl
    parent {
        id
        name
        user {
            id
            nickname
        }
    }
    description
    description2
    description3
    hasRealTimeVariable
    blockCategoryUsage
    childCnt
    commentGroup {
        group
        count
    }
    likeCntGroup {
        group
        count
    }
    visitGroup {
        group
        count
    }
    recentGroup {
        group
        count
    }
    published
    isFirstPublish
    tags

    speed
    objects
    variables
    submitId {
        id
    }
    cloudVariable
    messages
    functions
    tables
    scenes
    realTimeVariable {
        
    variableType
    key
    value
    array {
        key
        data
    }
    minValue
    maxValue
    visible
    x
    y
    width
    height
    object

    }
    learning
    expansionBlocks
    aiUtilizeBlocks
    hardwareLiteBlocks
    blockCategoryUsage

        }
     }
`;
                
                const headers = {
                    'Content-Type': 'application/json',
                    'Accept': '*/*',
                    'x-client-type': 'Client'
                };
                
                if (csrfToken) {
                    headers['csrf-token'] = csrfToken;
                }
                
                // 쿠키도 함께 전송
                if (this.entryCookie) {
                    headers['x-entry-cookie'] = this.entryCookie;
                }
                
                // Use server proxy to avoid CORS issues - /graphql/SELECT_PROJECT 엔드포인트 사용
                const response = await fetch(`/api/playentry/graphql/SELECT_PROJECT?id=${this.projectId}`, {
                    method: 'POST',
                    headers: headers,
                    credentials: 'include',
                    body: JSON.stringify({
                        query: query,
                        variables: { id: this.projectId }
                    })
                });
                
                const responseText = await response.text();
                console.log('GraphQL 응답 상태:', response.status);
                console.log('GraphQL 응답 미리보기:', responseText.substring(0, 300));
                
                if (!response.ok) {
                    console.error('GraphQL 요청 실패:', response.status, responseText);
                    
                    // JSON 에러 응답인지 확인
                    try {
                        const errorData = JSON.parse(responseText);
                        const errorMsg = errorData.error || errorData.message || `HTTP ${response.status}`;
                        const detail = errorData.detail || '';
                        throw new Error(`${errorMsg}${detail ? ' - ' + detail : ''}`);
                    } catch (parseErr) {
                        throw new Error(`HTTP ${response.status}: ${responseText.substring(0, 100)}`);
                    }
                }
                
                // JSON 파싱
                let project;
                try {
                    project = JSON.parse(responseText);
                } catch (parseErr) {
                    console.error('JSON 파싱 실패:', parseErr);
                    throw new Error(`JSON 파싱 실패: ${responseText.substring(0, 100)}`);
                }
                
                console.log('파싱된 프로젝트 데이터:', project);
                console.log('프로젝트 데이터 타입:', typeof project);
                console.log('프로젝트 키들:', project ? Object.keys(project) : 'null');
                
                // 에러 체크
                if (project && project.error) {
                    const detail = project.detail || '';
                    throw new Error(`서버 에러: ${project.error}${detail ? ' (' + detail + ')' : ''}`);
                }
                
                if (project && project.errors && Array.isArray(project.errors)) {
                    throw new Error(`GraphQL 에러: ${project.errors[0]?.message || JSON.stringify(project.errors)}`);
                }
                
                // 프로젝트 데이터 유효성 검사
                if (!project || typeof project !== 'object') {
                    throw new Error(`잘못된 프로젝트 데이터 형식: ${typeof project}`);
                }
                
                // 서버에서 이미 project 객체만 추출해서 반환함
                return project;
            }
            
            async initializeProject() {
                if (!this.projectData) {
                    throw new Error('프로젝트 데이터가 없습니다');
                }
                
                // Parse project data
                const objects = typeof this.projectData.objects === 'string' 
                    ? JSON.parse(this.projectData.objects) 
                    : this.projectData.objects;
                
                // Initialize canvas size
                this.canvas.width = 480;
                this.canvas.height = 360;
                
                // Scale canvas to fit screen
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());
                
                // Load sprites and initialize engine
                if (this.wasmEngine) {
                    // Use WASM engine
                    this.wasmEngine.load_project(JSON.stringify(this.projectData));
                } else {
                    // Fallback to JS engine
                    this.initJSEngine(objects);
                }
            }
            
            initJSEngine(objects) {
                // Simple JS fallback engine
                this.jsEngine = {
                    objects: objects || [],
                    variables: {},
                    running: false,
                    tick: 0
                };
            }
            
            resizeCanvas() {
                const container = document.getElementById('canvas-container');
                const aspectRatio = 480 / 360;
                
                let width = container.clientWidth;
                let height = container.clientHeight;
                
                if (width / height > aspectRatio) {
                    width = height * aspectRatio;
                } else {
                    height = width / aspectRatio;
                }
                
                this.canvas.style.width = width + 'px';
                this.canvas.style.height = height + 'px';
            }
            
            start() {
                this.isRunning = true;
                document.getElementById('btn-play').textContent = '⏸';
                document.getElementById('btn-play').classList.add('active');
                
                if (this.wasmEngine) {
                    this.wasmEngine.start();
                }
                
                this.gameLoop();
            }
            
            stop() {
                this.isRunning = false;
                document.getElementById('btn-play').textContent = '▶';
                document.getElementById('btn-play').classList.remove('active');
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                if (this.wasmEngine) {
                    this.wasmEngine.stop();
                }
            }
            
            toggle() {
                if (this.isRunning) {
                    this.stop();
                } else {
                    this.start();
                }
            }
            
            restart() {
                this.stop();
                if (this.wasmEngine) {
                    this.wasmEngine.reset();
                }
                setTimeout(() => this.start(), 100);
            }
            
            gameLoop() {
                if (!this.isRunning) return;
                
                // Update
                if (this.wasmEngine) {
                    this.wasmEngine.tick();
                } else if (this.jsEngine) {
                    this.jsEngine.tick++;
                }
                
                // Render
                this.render();
                
                this.animationId = requestAnimationFrame(() => this.gameLoop());
            }
            
            render() {
                // Clear canvas
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                if (this.wasmEngine) {
                    // Get render data from WASM and draw
                    const renderData = this.wasmEngine.get_render_data();
                    this.drawRenderData(renderData);
                } else if (this.jsEngine) {
                    // Simple JS rendering
                    this.drawJSEngine();
                }
            }
            
            drawRenderData(data) {
                if (!data) return;
                
                try {
                    const entities = JSON.parse(data);
                    for (const entity of entities) {
                        this.drawEntity(entity);
                    }
                } catch (e) {
                    console.error('렌더 데이터 파싱 실패:', e);
                }
            }
            
            drawEntity(entity) {
                this.ctx.save();
                
                // Transform to Entry coordinate system (center is 0,0)
                this.ctx.translate(
                    240 + entity.x, 
                    180 - entity.y
                );
                this.ctx.rotate(-entity.rotation * Math.PI / 180);
                this.ctx.scale(entity.scaleX, entity.scaleY);
                
                // Draw
                if (entity.visible) {
                    // Try to draw cached image
                    const img = imageCache.get(entity.pictureId);
                    if (img && img.complete) {
                        this.ctx.drawImage(
                            img,
                            -entity.width / 2, 
                            -entity.height / 2, 
                            entity.width, 
                            entity.height
                        );
                    } else {
                        // Fallback: draw colored rectangle
                        this.ctx.fillStyle = entity.color || '#4a90d9';
                        this.ctx.fillRect(
                            -entity.width / 2, 
                            -entity.height / 2, 
                            entity.width, 
                            entity.height
                        );
                    }
                }
                
                this.ctx.restore();
            }
            
            // Preload sprite images
            async preloadImages() {
                if (!this.projectData?.objects) return;
                
                const objects = typeof this.projectData.objects === 'string'
                    ? JSON.parse(this.projectData.objects)
                    : this.projectData.objects;
                
                for (const obj of objects) {
                    if (obj.sprite?.pictures) {
                        for (const pic of obj.sprite.pictures) {
                            if (pic.fileurl || pic.filename) {
                                const url = pic.fileurl || 
                                    `https://playentry.org/uploads/${pic.filename.substring(0,2)}/${pic.filename.substring(2,4)}/image/${pic.filename}.png`;
                                
                                const img = new Image();
                                img.crossOrigin = 'anonymous';
                                img.src = url;
                                imageCache.set(pic.id, img);
                            }
                        }
                    }
                }
            }
            
            drawJSEngine() {
                // Simple placeholder drawing
                this.ctx.fillStyle = '#4a90d9';
                this.ctx.font = '20px sans-serif';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(
                    this.projectData?.name || 'Entry Project',
                    240, 180
                );
                this.ctx.font = '14px sans-serif';
                this.ctx.fillStyle = '#666';
                this.ctx.fillText(
                    'WASM 엔진 로딩 중...',
                    240, 210
                );
            }
            
            setupControls() {
                document.getElementById('btn-play').addEventListener('click', () => this.toggle());
                document.getElementById('btn-restart').addEventListener('click', () => this.restart());
                document.getElementById('btn-fullscreen').addEventListener('click', () => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    } else {
                        document.documentElement.requestFullscreen();
                    }
                });
                
                // Keyboard controls
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.toggle();
                    } else if (e.code === 'KeyR') {
                        this.restart();
                    } else if (e.code === 'KeyF') {
                        document.documentElement.requestFullscreen();
                    }
                });
            }
            
            updateProgress(percent, text) {
                document.getElementById('loading-progress-bar').style.width = percent + '%';
                document.getElementById('loading-text').textContent = text;
            }
            
            hideLoading() {
                document.getElementById('loading').classList.add('hidden');
            }
            
            showError(message) {
                const errorDiv = document.getElementById('error');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                document.getElementById('loading').classList.add('hidden');
            }
        }
        
        // Start player
        const player = new EntryPlayer();
        player.initialize();
    </script>
</body>
</html>
