<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Entry Player (WebGL)</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family: 'Noto Sans KR', sans-serif;
            }

            #loading {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                transition: opacity 0.5s ease;
            }

            #loading.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .spinner {
                width: 60px;
                height: 60px;
                border: 4px solid rgba(255, 255, 255, 0.1);
                border-top: 4px solid #00d4ff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            #loading-text {
                color: #fff;
                margin-top: 20px;
                font-size: 18px;
                text-shadow: 0 2px 10px rgba(0, 212, 255, 0.5);
            }

            #loading-progress {
                width: 200px;
                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                margin-top: 15px;
                overflow: hidden;
            }

            #loading-progress-bar {
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, #00d4ff, #00ff88);
                transition: width 0.3s ease;
            }

            #canvas-container {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }

            #entryCanvas {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            #error {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 50, 50, 0.9);
                color: white;
                padding: 30px 50px;
                border-radius: 10px;
                text-align: center;
                display: none;
                z-index: 2000;
            }

            #controls {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                z-index: 100;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            #canvas-container:hover #controls {
                opacity: 1;
            }

            .control-btn {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                border: none;
                background: rgba(255, 255, 255, 0.2);
                color: white;
                font-size: 20px;
                cursor: pointer;
                backdrop-filter: blur(10px);
                transition: all 0.2s ease;
            }

            .control-btn:hover {
                background: rgba(255, 255, 255, 0.4);
                transform: scale(1.1);
            }

            .control-btn.active {
                background: #00d4ff;
            }

            #fps-counter {
                position: fixed;
                top: 10px;
                right: 10px;
                color: #00ff00;
                font-family: monospace;
                font-size: 14px;
                background: rgba(0, 0, 0, 0.7);
                padding: 5px 10px;
                border-radius: 4px;
                z-index: 1000;
            }
        </style>
        <script src="https://cdn.jsdelivr.net/npm/pixi.js@8/dist/pixi.min.js"></script>
    </head>
    <body>
        <div id="loading">
            <div class="spinner"></div>
            <div id="loading-text">프로젝트 로딩 중...</div>
            <div id="loading-progress">
                <div id="loading-progress-bar"></div>
            </div>
        </div>

        <div id="error"></div>

        <div id="canvas-container">
            <canvas id="entryCanvas" width="640" height="360"></canvas>
            <div id="controls">
                <button class="control-btn" id="btn-play" title="시작/정지">▶</button>
                <button class="control-btn" id="btn-restart" title="다시 시작">↺</button>
                <button class="control-btn" id="btn-fullscreen" title="전체화면">⛶</button>
            </div>
        </div>

        <div id="fps-counter">FPS: --</div>

        <script type="module">
            import '/renderer/PixiRenderer.js';

            const RENDER_STRIDE = 16;

            let WasmEngine = null;
            let wasmInit = null;

            try {
                const wasmModule = await import('/wasm/entry_wasm.js');
                wasmInit = wasmModule.default;
                WasmEngine = wasmModule.WasmEngine;
                console.log('WASM module imported');
            } catch (e) {
                console.warn('WASM module import failed:', e);
            }

            class ProjectTimer {
                constructor() {
                    this.reset();
                }

                reset() {
                    this.startTime = 0;
                    this.pausedTime = 0;
                    this.isPaused = true;
                    this.isInit = false;
                    this.value = 0;
                }

                start() {
                    const now = Date.now();
                    if (!this.isInit) {
                        this.startTime = now;
                        this.isPaused = false;
                        this.isInit = true;
                    } else if (this.isPaused) {
                        this.startTime = now - this.value * 1000;
                        this.isPaused = false;
                    }
                }

                stop() {
                    if (this.isInit && !this.isPaused) {
                        this.value = (Date.now() - this.startTime) / 1000;
                        this.isPaused = true;
                    }
                }

                getValue() {
                    if (this.isInit && !this.isPaused) {
                        this.value = (Date.now() - this.startTime) / 1000;
                    }
                    return Math.max(0, this.value);
                }
            }

            class BrushState {
                constructor() {
                    this.down = false;
                    this.color = '#ff0000';
                    this.size = 1;
                    this.opacity = 0;
                    this.lastX = null;
                    this.lastY = null;
                    this.fillDown = false;
                    this.fillColor = '#ff0000';
                    this.fillPath = [];
                }
            }

            class EntryPlayerWebGL {
                constructor() {
                    this.projectId = null;
                    this.projectData = null;
                    this.wasmEngine = null;
                    this.canvas = document.getElementById('entryCanvas');
                    this.pixiRenderer = null;
                    this.isRunning = false;
                    this.animationId = null;

                    this.mouseX = 0;
                    this.mouseY = 0;
                    this.mouseClicked = false;

                    this.wasmInitialized = false;
                    this.wasmMemory = null;

                    this.brushStates = new Map();
                    this.entityOrder = [];

                    this.scenes = [];
                    this.currentSceneId = null;
                    this.allObjects = [];
                    this.sceneObjectsMap = new Map();
                    this.dialogs = new Map();
                    this.textEntities = new Map();
                    this.projectTimer = new ProjectTimer();

                    this.fpsCounter = document.getElementById('fps-counter');
                    this.frameCount = 0;
                    this.lastFpsUpdate = 0;
                    this.currentFps = 0;
                }

                async initialize() {
                    this.updateProgress(10, 'WASM 엔진 초기화 중...');

                    try {
                        if (wasmInit && WasmEngine) {
                            const wasmInstance = await wasmInit();
                            this.wasmMemory = wasmInstance.memory;
                            this.wasmEngine = new WasmEngine();
                            this.wasmInitialized = true;
                            this.updateProgress(20, 'WASM 엔진 준비 완료');
                        } else {
                            this.wasmInitialized = false;
                        }
                    } catch (e) {
                        console.warn('WASM init failed:', e);
                        this.wasmEngine = null;
                        this.wasmInitialized = false;
                    }

                    this.updateProgress(25, 'PixiJS WebGL 렌더러 초기화 중...');

                    try {
                        this.pixiRenderer = new window.PixiRenderer(this.canvas, {
                            width: 640,
                            height: 360,
                        });
                        await this.pixiRenderer.init();
                        this.updateProgress(35, 'WebGL 렌더러 준비 완료');
                    } catch (e) {
                        console.error('PixiJS init failed:', e);
                        this.showError('WebGL 렌더러 초기화 실패: ' + e.message);
                        return;
                    }

                    const params = new URLSearchParams(window.location.search);
                    this.projectId = params.get('id');

                    if (!this.projectId) {
                        this.showError(
                            '프로젝트 ID가 필요합니다. URL에 ?id=프로젝트ID 형식으로 입력해주세요.'
                        );
                        return;
                    }

                    this.updateProgress(40, '프로젝트 데이터 로딩 중...');

                    try {
                        await this.loadProject();
                    } catch (e) {
                        this.showError('프로젝트 로딩 실패: ' + e.message);
                        return;
                    }

                    try {
                        this.updateProgress(80, '프로젝트 초기화 중...');
                        await this.initializeProject();
                    } catch (e) {
                        this.showError('프로젝트 초기화 실패: ' + e.message);
                        return;
                    }

                    try {
                        this.updateProgress(90, '이미지 로딩 중...');
                        await this.preloadImages();
                    } catch (e) {
                        console.warn('Some images failed to load:', e);
                    }

                    this.updateProgress(100, '완료!');

                    setTimeout(() => {
                        this.hideLoading();
                        this.start();
                    }, 500);

                    this.setupControls();
                }

                async loadProject() {
                    this.updateProgress(45, 'CSRF 토큰 획득 중...');
                    this.entryCookie = '';
                    const csrfToken = await this.getSessionData();

                    this.updateProgress(55, 'GraphQL 데이터 요청 중...');
                    this.projectData = await this.fetchProjectData(csrfToken);

                    this.updateProgress(70, '프로젝트 데이터 검증 중...');
                    if (!this.projectData || !this.projectData.id) {
                        throw new Error('Invalid project data');
                    }

                    console.log('Project loaded:', this.projectData.name);
                }

                async getSessionData() {
                    try {
                        const response = await fetch(`/api/playentry/iframe/${this.projectId}`);
                        const entryCookie = response.headers.get('X-Entry-Cookie') || '';
                        if (entryCookie) {
                            this.entryCookie = entryCookie;
                        }
                        const html = await response.text();
                        const csrfMatch = html.match(
                            /<meta\s+name=["']csrf-token["']\s+content=["']([^"']+)["']/i
                        );
                        return csrfMatch ? csrfMatch[1] : '';
                    } catch (e) {
                        return '';
                    }
                }

                async fetchProjectData(csrfToken) {
                    const query = `
                        query SELECT_PROJECT($id: ID! $groupId: ID) {
                            project(id: $id, groupId: $groupId) {
                                id name speed objects variables messages functions scenes
                            }
                        }
                    `;

                    const headers = {
                        'Content-Type': 'application/json',
                        Accept: '*/*',
                        'x-client-type': 'Client',
                    };

                    if (csrfToken) headers['csrf-token'] = csrfToken;
                    if (this.entryCookie) headers['x-entry-cookie'] = this.entryCookie;

                    const response = await fetch(
                        `/api/playentry/graphql/SELECT_PROJECT?id=${this.projectId}`,
                        {
                            method: 'POST',
                            headers,
                            credentials: 'include',
                            body: JSON.stringify({ query, variables: { id: this.projectId } }),
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    return await response.json();
                }

                async initializeProject() {
                    if (!this.projectData) throw new Error('No project data');

                    this.initializeScenes(this.projectData);
                    const objects = this.getCurrentSceneObjects();
                    this.initializeTextEntities(objects);

                    this.entityOrder = [];
                    for (let i = objects.length - 1; i >= 0; i--) {
                        this.entityOrder.push(i);
                    }

                    this.resizeCanvas();
                    window.addEventListener('resize', () => this.resizeCanvas());

                    if (this.wasmEngine) {
                        try {
                            const projectForWasm = this.prepareProjectForWasm(this.projectData);
                            this.wasmEngine.load_project(JSON.stringify(projectForWasm));

                            console.group(
                                '%c🚀 WebGL Engine Status',
                                'color: #00ff00; font-weight: bold;'
                            );
                            console.log('%c✅ PixiJS v8:', 'color: #00d4ff', 'Active');
                            console.log('%c✅ WebGL Renderer:', 'color: #00d4ff', 'Active');
                            console.log(
                                '%c✅ WASM Memory:',
                                'color: #00d4ff',
                                this.wasmMemory
                                    ? `${this.wasmMemory.buffer.byteLength.toLocaleString()} bytes`
                                    : 'Not linked'
                            );
                            console.groupEnd();
                        } catch (e) {
                            console.error('WASM project load failed:', e);
                            this.wasmEngine = null;
                        }
                    }
                }

                initializeScenes(projectData) {
                    let scenes = projectData.scenes;
                    if (typeof scenes === 'string') {
                        try {
                            scenes = JSON.parse(scenes);
                        } catch (e) {
                            scenes = [];
                        }
                    }
                    this.scenes = scenes || [];

                    let objects = projectData.objects;
                    if (typeof objects === 'string') {
                        try {
                            objects = JSON.parse(objects);
                        } catch (e) {
                            objects = [];
                        }
                    }
                    this.allObjects = objects || [];

                    this.sceneObjectsMap.clear();
                    for (const scene of this.scenes) {
                        this.sceneObjectsMap.set(scene.id, []);
                    }

                    for (const obj of this.allObjects) {
                        const sceneId = obj.scene;
                        if (sceneId && this.sceneObjectsMap.has(sceneId)) {
                            this.sceneObjectsMap.get(sceneId).push(obj);
                        } else if (this.scenes.length > 0) {
                            const firstSceneId = this.scenes[0].id;
                            if (!this.sceneObjectsMap.has(firstSceneId)) {
                                this.sceneObjectsMap.set(firstSceneId, []);
                            }
                            this.sceneObjectsMap.get(firstSceneId).push(obj);
                        }
                    }

                    if (this.scenes.length > 0) {
                        this.currentSceneId = this.scenes[0].id;
                    }
                }

                initializeTextEntities(objects) {
                    this.textEntities.clear();
                    if (!objects) return;

                    for (let i = 0; i < objects.length; i++) {
                        const obj = objects[i];
                        const hasText =
                            obj.text !== undefined ||
                            (obj.entity && obj.entity.text !== undefined) ||
                            obj.objectType === 'textBox';

                        if (hasText) {
                            this.textEntities.set(i, {
                                text: (obj.entity && obj.entity.text) || obj.text || '',
                                font: (obj.entity && obj.entity.font) || 'Nanum Gothic',
                                colour: (obj.entity && obj.entity.colour) || '#000000',
                                bgColor: obj.entity?.bgColor,
                                underLine: obj.entity?.underLine || false,
                                strike: obj.entity?.strike || false,
                                lineBreak: obj.entity?.lineBreak || false,
                                textAlign: obj.entity?.textAlign || 0,
                            });
                        }
                    }
                }

                getCurrentSceneObjects() {
                    if (!this.currentSceneId) return this.allObjects;
                    return this.sceneObjectsMap.get(this.currentSceneId) || [];
                }

                prepareProjectForWasm(projectData) {
                    const prepared = { ...projectData };

                    const parseField = (field) => {
                        if (typeof prepared[field] === 'string') {
                            try {
                                prepared[field] = JSON.parse(prepared[field]);
                            } catch (e) {
                                prepared[field] = [];
                            }
                        }
                    };

                    ['variables', 'functions', 'messages', 'scenes', 'tables'].forEach(parseField);

                    if (this.currentSceneId && this.sceneObjectsMap.size > 0) {
                        const sceneObjects = this.getCurrentSceneObjects();
                        prepared.objects = sceneObjects.map((obj) => {
                            const newObj = { ...obj };
                            if (typeof newObj.script === 'string') {
                                try {
                                    newObj.script = JSON.parse(newObj.script);
                                } catch (e) {
                                    newObj.script = [];
                                }
                            }
                            return newObj;
                        });
                    } else {
                        if (typeof prepared.objects === 'string') {
                            try {
                                prepared.objects = JSON.parse(prepared.objects);
                            } catch (e) {
                                prepared.objects = [];
                            }
                        }
                        if (Array.isArray(prepared.objects)) {
                            prepared.objects = prepared.objects.map((obj) => {
                                const newObj = { ...obj };
                                if (typeof newObj.script === 'string') {
                                    try {
                                        newObj.script = JSON.parse(newObj.script);
                                    } catch (e) {
                                        newObj.script = [];
                                    }
                                }
                                return newObj;
                            });
                        }
                    }

                    return prepared;
                }

                async preloadImages() {
                    const objects = this.getCurrentSceneObjects();
                    const loadPromises = [];

                    for (const obj of objects) {
                        if (obj.sprite?.pictures) {
                            for (const pic of obj.sprite.pictures) {
                                if (pic.id) {
                                    const url = this.getPictureUrl(pic);
                                    loadPromises.push(
                                        this.pixiRenderer
                                            .loadTexture(pic.id, url)
                                            .catch((e) =>
                                                console.warn(`Failed to load ${pic.id}:`, e)
                                            )
                                    );
                                }
                            }
                        }
                    }

                    await Promise.all(loadPromises);
                    console.log(`Loaded ${loadPromises.length} textures`);
                }

                getPictureUrl(pic) {
                    let originalUrl = pic.fileurl;
                    if (!originalUrl && pic.filename) {
                        originalUrl = `uploads/${pic.filename.substring(0, 2)}/${pic.filename.substring(2, 4)}/image/${pic.filename}.png`;
                    }

                    if (originalUrl?.startsWith('http://') || originalUrl?.startsWith('https://')) {
                        return originalUrl
                            .replace('https://playentry.org/', '/api/playentry/image/')
                            .replace('http://playentry.org/', '/api/playentry/image/');
                    }
                    return `/api/playentry/image/${originalUrl}`;
                }

                resizeCanvas() {
                    const container = document.getElementById('canvas-container');
                    const aspectRatio = 640 / 360;

                    let width = container.clientWidth;
                    let height = container.clientHeight;

                    if (width / height > aspectRatio) {
                        width = height * aspectRatio;
                    } else {
                        height = width / aspectRatio;
                    }

                    this.canvas.style.width = width + 'px';
                    this.canvas.style.height = height + 'px';
                }

                start() {
                    this.isRunning = true;
                    document.getElementById('btn-play').textContent = '⏸';
                    document.getElementById('btn-play').classList.add('active');

                    if (this.wasmEngine) {
                        this.wasmEngine.start();
                    }

                    this.gameLoop();
                }

                stop() {
                    this.isRunning = false;
                    document.getElementById('btn-play').textContent = '▶';
                    document.getElementById('btn-play').classList.remove('active');

                    if (this.animationId) {
                        cancelAnimationFrame(this.animationId);
                    }

                    if (this.wasmEngine) {
                        this.wasmEngine.stop();
                    }
                }

                toggle() {
                    if (this.isRunning) {
                        this.stop();
                    } else {
                        this.start();
                    }
                }

                restart() {
                    this.stop();

                    if (this.scenes.length > 0) {
                        this.currentSceneId = this.scenes[0].id;
                        const sceneObjects = this.getCurrentSceneObjects();
                        this.entityOrder = [];
                        for (let i = sceneObjects.length - 1; i >= 0; i--) {
                            this.entityOrder.push(i);
                        }
                    }

                    this.brushStates.clear();

                    if (this.isWasmEngineValid()) {
                        try {
                            this.wasmEngine.reset();
                        } catch (e) {
                            console.error('WASM reset failed:', e);
                            this.wasmEngine = null;
                            this.wasmInitialized = false;
                        }
                    }

                    setTimeout(() => this.start(), 100);
                }

                isWasmEngineValid() {
                    return (
                        this.wasmEngine &&
                        this.wasmInitialized &&
                        this.wasmEngine.__wbg_ptr !== 0 &&
                        this.wasmEngine.__wbg_ptr !== undefined
                    );
                }

                gameLoop() {
                    if (!this.isRunning) return;

                    this.updateFps();

                    if (this.isWasmEngineValid()) {
                        try {
                            this.wasmEngine.update_mouse(
                                this.mouseX,
                                this.mouseY,
                                this.mouseClicked
                            );

                            if (typeof this.wasmEngine.update_project_timer === 'function') {
                                this.wasmEngine.update_project_timer(this.projectTimer.getValue());
                            }

                            this.wasmEngine.tick();
                            this.handleJsActions();
                        } catch (e) {
                            if (!this._tickErrorLogged) {
                                this._tickErrorLogged = true;
                                console.error('WASM tick failed:', e);
                            }
                            this.wasmEngine = null;
                            this.wasmInitialized = false;
                        }
                    }

                    this.render();

                    this.animationId = requestAnimationFrame(() => this.gameLoop());
                }

                updateFps() {
                    this.frameCount++;
                    const now = performance.now();
                    if (now - this.lastFpsUpdate >= 1000) {
                        this.currentFps = this.frameCount;
                        this.frameCount = 0;
                        this.lastFpsUpdate = now;
                        this.fpsCounter.textContent = `FPS: ${this.currentFps}`;
                    }
                }

                handleJsActions() {
                    if (!this.isWasmEngineValid()) return;
                    if (typeof this.wasmEngine.get_js_actions !== 'function') return;

                    let actionsJson;
                    try {
                        actionsJson = this.wasmEngine.get_js_actions();
                    } catch (e) {
                        return;
                    }

                    if (!actionsJson || actionsJson === '[]') return;

                    try {
                        const actions = JSON.parse(actionsJson);
                        for (const action of actions) {
                            this.processJsAction(action);
                        }
                    } catch (e) {
                        console.error('Failed to parse JS actions:', e);
                    }
                }

                processJsAction(action) {
                    const { type, data } = action;

                    switch (type) {
                        case 'BrushEraseAll':
                            this.pixiRenderer.handleBrushEraseAll(data.entity_id);
                            break;
                        case 'SetBrushColor': {
                            const state = this.getBrushState(data.entity_id);
                            state.color = data.color;
                            break;
                        }
                        case 'SetRandomColor': {
                            const state = this.getBrushState(data.entity_id);
                            state.color =
                                '#' +
                                Math.floor(Math.random() * 16777215)
                                    .toString(16)
                                    .padStart(6, '0');
                            break;
                        }
                        case 'SetThickness': {
                            const state = this.getBrushState(data.entity_id);
                            state.size = data.thickness;
                            break;
                        }
                        case 'SetBrushTransparency': {
                            const state = this.getBrushState(data.entity_id);
                            state.opacity = data.transparency;
                            break;
                        }
                        case 'StartDrawing': {
                            const state = this.getBrushState(data.entity_id);
                            state.down = true;
                            state.lastX = 320 + data.x;
                            state.lastY = 180 - data.y;
                            break;
                        }
                        case 'StopDrawing': {
                            const state = this.getBrushState(data.entity_id);
                            state.down = false;
                            state.lastX = null;
                            state.lastY = null;
                            break;
                        }
                        case 'BrushPath': {
                            const state = this.getBrushState(data.entity_id);
                            const points = data.points.map(([x, y]) => ({ x, y }));
                            this.pixiRenderer.handleBrushPath(
                                data.entity_id,
                                points,
                                state.color,
                                state.size,
                                state.opacity
                            );
                            if (points.length > 0) {
                                const last = points[points.length - 1];
                                state.lastX = 320 + last.x;
                                state.lastY = 180 - last.y;
                            }
                            break;
                        }
                        case 'StartFill': {
                            const state = this.getBrushState(data.entity_id);
                            state.fillDown = true;
                            state.fillPath = [{ x: data.x, y: data.y }];
                            break;
                        }
                        case 'StopFill': {
                            const state = this.getBrushState(data.entity_id);
                            if (state.fillPath.length >= 3) {
                                this.pixiRenderer.handleFillFinalize(
                                    data.entity_id,
                                    state.fillPath,
                                    state.fillColor
                                );
                            }
                            state.fillDown = false;
                            state.fillPath = [];
                            break;
                        }
                        case 'SetFillColor': {
                            const state = this.getBrushState(data.entity_id);
                            state.fillColor = data.color;
                            break;
                        }
                        case 'FillPath': {
                            const state = this.getBrushState(data.entity_id);
                            for (const [x, y] of data.points) {
                                state.fillPath.push({ x, y });
                            }
                            if (state.fillDown) {
                                this.pixiRenderer.handleFillPreview(
                                    state.fillPath,
                                    state.fillColor
                                );
                            }
                            break;
                        }
                        case 'ShowDialog':
                            this.dialogs.set(data.entity_id, {
                                message: data.message,
                                mode: data.mode,
                            });
                            break;
                        case 'RemoveDialog':
                            this.dialogs.delete(data.entity_id);
                            this.pixiRenderer.removeDialog(data.entity_id);
                            break;
                        case 'UpdateText':
                            this.textEntities.set(data.entity_id, {
                                text: data.text,
                                font: data.font,
                                colour: data.colour,
                                bgColor: data.bg_color,
                                underLine: data.under_line,
                                strike: data.strike,
                                lineBreak: data.line_break,
                                textAlign: data.text_align,
                            });
                            break;
                        case 'StartScene':
                            this.switchToScene(data.scene_id);
                            break;
                        case 'StartNextScene':
                            this.switchToNextScene();
                            break;
                        case 'StartPreviousScene':
                            this.switchToPreviousScene();
                            break;
                        case 'DeleteClone':
                            this.pixiRenderer.handleEntityDelete(data.entity_id);
                            break;
                        case 'RemoveAllClones':
                            break;
                        case 'TimerAction':
                            if (data.action === 'START') this.projectTimer.start();
                            else if (data.action === 'STOP') this.projectTimer.stop();
                            else if (data.action === 'RESET') this.projectTimer.reset();
                            break;
                    }
                }

                getBrushState(entityId) {
                    if (!this.brushStates.has(entityId)) {
                        this.brushStates.set(entityId, new BrushState());
                    }
                    return this.brushStates.get(entityId);
                }

                render() {
                    if (!this.pixiRenderer || !this.pixiRenderer.initialized) return;

                    if (this.isWasmEngineValid() && this.wasmMemory) {
                        try {
                            const ptr = this.wasmEngine.get_render_buffer_ptr();
                            const len = this.wasmEngine.get_render_buffer_len();

                            if (ptr && len > 0) {
                                const buffer = new Float64Array(this.wasmMemory.buffer, ptr, len);
                                const objects = this.getCurrentSceneObjects();
                                this.pixiRenderer.render(buffer, { objects });

                                for (let i = 0; i < buffer.length; i += RENDER_STRIDE) {
                                    const id = buffer[i];
                                    const x = buffer[i + 1];
                                    const y = buffer[i + 2];
                                    const height = buffer[i + 8];
                                    const dialog = this.dialogs.get(id);
                                    if (dialog) {
                                        this.pixiRenderer.drawDialog(
                                            id,
                                            dialog.message,
                                            dialog.mode,
                                            x,
                                            y,
                                            height
                                        );
                                    }
                                }
                            }
                        } catch (e) {
                            if (!this._renderErrorLogged) {
                                this._renderErrorLogged = true;
                                console.error('Render error:', e);
                            }
                        }
                    }
                }

                switchToScene(sceneId) {
                    const scene = this.scenes.find((s) => s.id === sceneId);
                    if (!scene) return false;

                    this.currentSceneId = sceneId;
                    const sceneObjects = this.getCurrentSceneObjects();
                    this.initializeTextEntities(sceneObjects);

                    this.entityOrder = [];
                    for (let i = sceneObjects.length - 1; i >= 0; i--) {
                        this.entityOrder.push(i);
                    }

                    if (this.isWasmEngineValid()) {
                        try {
                            let savedVariables = null;
                            if (typeof this.wasmEngine.get_variables === 'function') {
                                savedVariables = this.wasmEngine.get_variables();
                            }

                            const sceneProjectData = this.createSceneProjectData(sceneId);
                            this.wasmEngine.stop();
                            this.wasmEngine.load_project(JSON.stringify(sceneProjectData));

                            if (
                                savedVariables &&
                                typeof this.wasmEngine.set_variables === 'function'
                            ) {
                                this.wasmEngine.set_variables(savedVariables);
                            }

                            this.wasmEngine.start_scene();
                        } catch (e) {
                            console.error('Scene switch error:', e);
                            return false;
                        }
                    }

                    this.preloadSceneImages(sceneObjects);
                    return true;
                }

                switchToNextScene() {
                    const idx = this.scenes.findIndex((s) => s.id === this.currentSceneId);
                    if (idx >= 0 && idx < this.scenes.length - 1) {
                        return this.switchToScene(this.scenes[idx + 1].id);
                    }
                    return false;
                }

                switchToPreviousScene() {
                    const idx = this.scenes.findIndex((s) => s.id === this.currentSceneId);
                    if (idx > 0) {
                        return this.switchToScene(this.scenes[idx - 1].id);
                    }
                    return false;
                }

                createSceneProjectData(sceneId) {
                    const sceneObjects = this.sceneObjectsMap.get(sceneId) || [];
                    const preparedObjects = sceneObjects.map((obj) => {
                        const newObj = { ...obj };
                        if (typeof newObj.script === 'string') {
                            try {
                                newObj.script = JSON.parse(newObj.script);
                            } catch (e) {
                                newObj.script = [];
                            }
                        }
                        return newObj;
                    });

                    let variables = this.projectData.variables;
                    if (typeof variables === 'string') {
                        try {
                            variables = JSON.parse(variables);
                        } catch (e) {
                            variables = [];
                        }
                    }

                    let functions = this.projectData.functions;
                    if (typeof functions === 'string') {
                        try {
                            functions = JSON.parse(functions);
                        } catch (e) {
                            functions = [];
                        }
                    }

                    let messages = this.projectData.messages;
                    if (typeof messages === 'string') {
                        try {
                            messages = JSON.parse(messages);
                        } catch (e) {
                            messages = [];
                        }
                    }

                    return {
                        id: this.projectData.id,
                        name: this.projectData.name,
                        speed: this.projectData.speed || 60,
                        objects: preparedObjects,
                        variables: variables || [],
                        functions: functions || [],
                        messages: messages || [],
                        scenes: this.scenes,
                    };
                }

                async preloadSceneImages(objects) {
                    for (const obj of objects) {
                        if (obj.sprite?.pictures) {
                            for (const pic of obj.sprite.pictures) {
                                if (pic.id && !this.pixiRenderer.imageCache.has(pic.id)) {
                                    const url = this.getPictureUrl(pic);
                                    this.pixiRenderer.loadTexture(pic.id, url);
                                }
                            }
                        }
                    }
                }

                setupControls() {
                    document
                        .getElementById('btn-play')
                        .addEventListener('click', () => this.toggle());
                    document
                        .getElementById('btn-restart')
                        .addEventListener('click', () => this.restart());
                    document.getElementById('btn-fullscreen').addEventListener('click', () => {
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else {
                            document.documentElement.requestFullscreen();
                        }
                    });

                    document.addEventListener('keydown', (e) => {
                        if (e.code === 'Space') {
                            e.preventDefault();
                            this.toggle();
                        } else if (e.code === 'KeyR') {
                            this.restart();
                        } else if (e.code === 'KeyF') {
                            if (document.fullscreenElement) {
                                document.exitFullscreen();
                            } else {
                                document.documentElement.requestFullscreen();
                            }
                        }

                        if (this.isWasmEngineValid()) {
                            this.wasmEngine.fire_key_event(e.keyCode);
                        }
                    });

                    this.canvas.addEventListener('mousemove', (e) => {
                        const rect = this.canvas.getBoundingClientRect();
                        const scaleX = 640 / rect.width;
                        const scaleY = 360 / rect.height;
                        this.mouseX = (e.clientX - rect.left) * scaleX - 320;
                        this.mouseY = 180 - (e.clientY - rect.top) * scaleY;
                    });

                    this.canvas.addEventListener('mousedown', (e) => {
                        this.mouseClicked = true;
                        if (this.isWasmEngineValid()) {
                            this.wasmEngine.fire_mouse_clicked();
                        }
                    });

                    this.canvas.addEventListener('mouseup', () => {
                        this.mouseClicked = false;
                        if (this.isWasmEngineValid()) {
                            this.wasmEngine.fire_mouse_click_cancled();
                        }
                    });

                    this.canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const rect = this.canvas.getBoundingClientRect();
                        const scaleX = 640 / rect.width;
                        const scaleY = 360 / rect.height;
                        this.mouseX = (touch.clientX - rect.left) * scaleX - 320;
                        this.mouseY = 180 - (touch.clientY - rect.top) * scaleY;
                        this.mouseClicked = true;
                        if (this.isWasmEngineValid()) {
                            this.wasmEngine.fire_mouse_clicked();
                        }
                    });

                    this.canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        const touch = e.touches[0];
                        const rect = this.canvas.getBoundingClientRect();
                        const scaleX = 640 / rect.width;
                        const scaleY = 360 / rect.height;
                        this.mouseX = (touch.clientX - rect.left) * scaleX - 320;
                        this.mouseY = 180 - (touch.clientY - rect.top) * scaleY;
                    });

                    this.canvas.addEventListener('touchend', () => {
                        this.mouseClicked = false;
                        if (this.isWasmEngineValid()) {
                            this.wasmEngine.fire_mouse_click_cancled();
                        }
                    });
                }

                updateProgress(percent, text) {
                    document.getElementById('loading-progress-bar').style.width = percent + '%';
                    document.getElementById('loading-text').textContent = text;
                }

                hideLoading() {
                    document.getElementById('loading').classList.add('hidden');
                }

                showError(message) {
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = message;
                    document.getElementById('loading').classList.add('hidden');
                }
            }

            const player = new EntryPlayerWebGL();
            player.initialize();
        </script>
    </body>
</html>
