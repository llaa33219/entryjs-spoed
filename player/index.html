                    const entityId = buffer[offset];
                    const entityObj = this.findObjectById(entityId);

                    if (entityObj && entityObj.selectedPictureId) {
                        const img = imageCache.get(entityObj.selectedPictureId);
                        if (img && img.complete && img.naturalWidth > 0) {
                            try {
                                this.ctx.drawImage(img, -width / 2, -height / 2, width, height);
                            } catch (drawError) {
                                // Ignore
                            }
                        } else {
                            // Fallback rect
                            this.ctx.fillStyle = '#4a90d9';
                            this.ctx.fillRect(-width / 2, -height / 2, width, height);
                        }
                    } else {
                        // Fallback rect
                        this.ctx.fillStyle = '#4a90d9';
                        this.ctx.fillRect(-width / 2, -height / 2, width, height);
                    }

                    this.ctx.restore();

                    // Draw dialog balloon (after restore to use screen coordinates)
                    const dialog = this.dialogs.get(entityId);
                    if (dialog) {
                        // Pass a mock entity object with dialog props
                        const mockEntity = {
                            x: x,
                            y: y,
                            width: width,
                            height: height,
                            dialogMessage: dialog.message,
                            dialogMode: dialog.mode,
                        };
                        this.drawDialog(mockEntity);
                    }
                }

                findObjectById(entityId) {
                    // Fast lookup if possible, or search allObjects
                    // objects are indexed by entityId in WASM (0 to N)
                    // If allObjects matches WASM indices:
                    return this.allObjects[entityId];
                }

                // drawRenderData(data) is deprecated/removed in favor of drawRenderBuffer

                /*
                drawRenderData(data) {
                    // ... old JSON logic removed ...
                }
                */

                drawFallbackRect(entity) {
                    this.ctx.fillStyle = entity.color || '#4a90d9';
                    this.ctx.fillRect(
                        -entity.width / 2,
                        -entity.height / 2,
                        entity.width || 50,
                        entity.height || 50
                    );
                }

                // Draw dialog balloon (speak/think)
                drawDialog(entity) {
                    const message = entity.dialogMessage;
                    const mode = entity.dialogMode || 'speak';

                    this.ctx.save();

                    // Calculate position in screen coordinates
                    const screenX = 240 + entity.x;
                    const screenY = 180 - entity.y;
                    const entityHalfHeight = (entity.height || 50) / 2;

                    // Set font and measure text
                    this.ctx.font = '14px "Noto Sans KR", sans-serif';
                    const textMetrics = this.ctx.measureText(message);
                    const textWidth = textMetrics.width;
                    const textHeight = 18; // Approximate line height

                    // Balloon dimensions
                    const padding = 12;
                    const balloonWidth = textWidth + padding * 2;
                    const balloonHeight = textHeight + padding * 2;
                    const radius = 10;
                    const margin = 5; // margin from canvas edge

                    // Initial position: above entity
                    let balloonX = screenX - balloonWidth / 2;
                    let balloonY = screenY - entityHalfHeight - balloonHeight - 20;
                    let isBelowEntity = false;

                    // Clamp X position to stay within canvas
                    balloonX = Math.max(margin, Math.min(480 - balloonWidth - margin, balloonX));

                    // If balloon goes above canvas, place it below entity
                    if (balloonY < margin) {
                        balloonY = screenY + entityHalfHeight + 20;
                        isBelowEntity = true;
                    }

                    // Also clamp Y to stay within canvas
                    if (balloonY + balloonHeight > 360 - margin) {
                        balloonY = 360 - balloonHeight - margin;
                    }

                    // Calculate tail target (entity edge)
                    const tailTargetY = isBelowEntity
                        ? screenY + entityHalfHeight + 5
                        : screenY - entityHalfHeight - 5;

                    if (mode === 'think') {
                        // Think bubble: cloud-style with dots
                        this.drawThinkBubble(
                            balloonX,
                            balloonY,
                            balloonWidth,
                            balloonHeight,
                            radius,
                            screenX,
                            tailTargetY,
                            isBelowEntity
                        );
                    } else {
                        // Speak bubble: regular balloon with tail
                        this.drawSpeakBubble(
                            balloonX,
                            balloonY,
                            balloonWidth,
                            balloonHeight,
                            radius,
                            screenX,
                            tailTargetY,
                            isBelowEntity
                        );
                    }

                    // Draw text
                    this.ctx.fillStyle = '#000000';
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(
                        message,
                        balloonX + balloonWidth / 2,
                        balloonY + balloonHeight / 2
                    );

                    this.ctx.restore();
                }

                // Draw speak balloon (with triangle tail)
                drawSpeakBubble(x, y, width, height, radius, tailX, tailY, isBelowEntity = false) {
                    const ctx = this.ctx;
                    const tailWidth = 10;

                    // Clamp tailX to be within balloon width
                    const clampedTailX = Math.max(
                        x + tailWidth,
                        Math.min(x + width - tailWidth, tailX)
                    );

                    ctx.beginPath();

                    if (isBelowEntity) {
                        // Tail pointing UP (balloon is below entity)
                        ctx.moveTo(x + radius, y);

                        // Top edge with tail
                        ctx.lineTo(clampedTailX - tailWidth / 2, y);
                        ctx.lineTo(clampedTailX, tailY);
                        ctx.lineTo(clampedTailX + tailWidth / 2, y);

                        ctx.lineTo(x + width - radius, y);
                        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                        ctx.lineTo(x + width, y + height - radius);
                        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                        ctx.lineTo(x + radius, y + height);
                        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                        ctx.lineTo(x, y + radius);
                        ctx.quadraticCurveTo(x, y, x + radius, y);
                    } else {
                        // Tail pointing DOWN (balloon is above entity)
                        ctx.moveTo(x + radius, y);
                        ctx.lineTo(x + width - radius, y);
                        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                        ctx.lineTo(x + width, y + height - radius);
                        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);

                        // Bottom edge with tail
                        ctx.lineTo(clampedTailX + tailWidth / 2, y + height);
                        ctx.lineTo(clampedTailX, tailY);
                        ctx.lineTo(clampedTailX - tailWidth / 2, y + height);

                        ctx.lineTo(x + radius, y + height);
                        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                        ctx.lineTo(x, y + radius);
                        ctx.quadraticCurveTo(x, y, x + radius, y);
                    }

                    ctx.closePath();

                    // Fill and stroke
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Draw think bubble (cloud-style with dots)
                drawThinkBubble(x, y, width, height, radius, tailX, tailY, isBelowEntity = false) {
                    const ctx = this.ctx;

                    // Draw cloud-like rounded rectangle
                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + width - radius, y);
                    ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                    ctx.lineTo(x + width, y + height - radius);
                    ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                    ctx.lineTo(x + radius, y + height);
                    ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();

                    // Fill and stroke
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Clamp tailX to be within balloon width
                    const clampedTailX = Math.max(x + 10, Math.min(x + width - 10, tailX));

                    // Draw thought dots (3 circles getting smaller)
                    const dotSizes = [6, 4, 3];
                    let dotY;

                    if (isBelowEntity) {
                        // Dots pointing UP (balloon is below entity)
                        dotY = y - 8;
                        for (const size of dotSizes) {
                            ctx.beginPath();
                            ctx.arc(clampedTailX, dotY, size, 0, Math.PI * 2);
                            ctx.fillStyle = '#ffffff';
                            ctx.fill();
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1.5;
                            ctx.stroke();
                            dotY -= size * 2 + 3;
                        }
                    } else {
                        // Dots pointing DOWN (balloon is above entity)
                        dotY = y + height + 8;
                        for (const size of dotSizes) {
                            ctx.beginPath();
                            ctx.arc(clampedTailX, dotY, size, 0, Math.PI * 2);
                            ctx.fillStyle = '#ffffff';
                            ctx.fill();
                            ctx.strokeStyle = '#000000';
                            ctx.lineWidth = 1.5;
                            ctx.stroke();
                            dotY += size * 2 + 3;
                        }
                    }
                }

                // Preload sprite images
                async preloadImages() {
                    if (!this.projectData?.objects) return;

                    const objects =
                        typeof this.projectData.objects === 'string'
                            ? JSON.parse(this.projectData.objects)
                            : this.projectData.objects;

                    const loadPromises = [];

                    for (const obj of objects) {
                        if (obj.sprite?.pictures) {
                            for (const pic of obj.sprite.pictures) {
                                if (pic.fileurl || pic.filename) {
                                    // 원본 URL 생성
                                    let originalUrl = pic.fileurl;
                                    if (!originalUrl && pic.filename) {
                                        originalUrl = `uploads/${pic.filename.substring(0, 2)}/${pic.filename.substring(2, 4)}/image/${pic.filename}.png`;
                                    }

                                    // 프록시 URL로 변환 (playentry.org 직접 접근 대신 우리 서버 프록시 사용)
                                    let proxyUrl;
                                    if (
                                        originalUrl.startsWith('http://') ||
                                        originalUrl.startsWith('https://')
                                    ) {
                                        // 절대 URL인 경우 playentry.org 부분을 프록시로 교체
                                        proxyUrl = originalUrl
                                            .replace(
                                                'https://playentry.org/',
                                                '/api/playentry/image/'
                                            )
                                            .replace(
                                                'http://playentry.org/',
                                                '/api/playentry/image/'
                                            );
                                    } else {
                                        // 상대 URL인 경우
                                        proxyUrl = `/api/playentry/image/${originalUrl}`;
                                    }

                                    console.log(`이미지 로드: ${pic.id} -> ${proxyUrl}`);

                                    const img = new Image();

                                    // 이미지 로드 Promise 생성
                                    const loadPromise = new Promise((resolve, reject) => {
                                        img.onload = () => {
                                            console.log(`이미지 로드 완료: ${pic.id}`);
                                            resolve(pic.id);
                                        };
                                        img.onerror = (e) => {
                                            console.warn(
                                                `이미지 로드 실패: ${pic.id} - ${proxyUrl}`,
                                                e
                                            );
                                            reject(new Error(`이미지 로드 실패: ${pic.id}`));
                                        };
                                    });

                                    img.src = proxyUrl;
                                    imageCache.set(pic.id, img);
                                    loadPromises.push(loadPromise.catch(() => null)); // 실패해도 계속 진행
                                }
                            }
                        }
                    }

                    // 모든 이미지 로드 대기 (최대 10초)
                    if (loadPromises.length > 0) {
                        console.log(`${loadPromises.length}개 이미지 로드 대기 중...`);
                        await Promise.race([
                            Promise.all(loadPromises),
                            new Promise((resolve) => setTimeout(resolve, 10000)), // 10초 타임아웃
                        ]);
                        console.log('이미지 로드 완료 또는 타임아웃');
                    }
                }

                drawJSEngine() {
                    // Simple placeholder drawing
                    this.ctx.fillStyle = '#4a90d9';
                    this.ctx.font = '20px sans-serif';
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(this.projectData?.name || 'Entry Project', 240, 180);
                    this.ctx.font = '14px sans-serif';
                    this.ctx.fillStyle = '#666';
                    this.ctx.fillText('WASM 엔진 로딩 중...', 240, 210);
                }

                setupControls() {
                    document
                        .getElementById('btn-play')
                        .addEventListener('click', () => this.toggle());
                    document
                        .getElementById('btn-restart')
                        .addEventListener('click', () => this.restart());
                    document.getElementById('btn-fullscreen').addEventListener('click', () => {
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        } else {
                            document.documentElement.requestFullscreen();
                        }
                    });

                    // Keyboard controls
                    document.addEventListener('keydown', (e) => {
                        if (e.code === 'Space') {
                            e.preventDefault();
                            this.toggle();
                        } else if (e.code === 'KeyR') {
                            this.restart();
                        } else if (e.code === 'KeyF') {
                            document.documentElement.requestFullscreen();
                        }
                    });

                    // Mouse tracking for WASM engine
                    this.canvas.addEventListener('mousemove', (e) => {
                        this.updateMousePosition(e);
                    });

                    this.canvas.addEventListener('mousedown', (e) => {
                        this.mouseClicked = true;
                        this.updateMousePosition(e);

                        if (this.isWasmEngineValid()) {
                            // Update mouse position in WASM before firing click event
                            // This ensures the click happens at the correct coordinates
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_clicked();
                            } catch (err) {
                                console.warn('WASM mouse click error:', err);
                            }
                        }
                    });

                    this.canvas.addEventListener('mouseup', (e) => {
                        this.mouseClicked = false;
                        this.updateMousePosition(e);

                        if (this.isWasmEngineValid()) {
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_click_cancled();
                            } catch (err) {
                                console.warn('WASM mouse release error:', err);
                            }
                        }
                    });

                    this.canvas.addEventListener('mouseleave', (e) => {
                        this.mouseClicked = false;
                    });

                    // Touch support for mobile
                    this.canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        this.mouseClicked = true;
                        if (e.touches.length > 0) {
                            this.updateTouchPosition(e.touches[0]);
                        }

                        if (this.isWasmEngineValid()) {
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_clicked();
                            } catch (err) {
                                console.warn('WASM touch start error:', err);
                            }
                        }
                    });

                    this.canvas.addEventListener('touchmove', (e) => {
                        e.preventDefault();
                        if (e.touches.length > 0) {
                            this.updateTouchPosition(e.touches[0]);
                        }
                    });

                    this.canvas.addEventListener('touchend', (e) => {
                        e.preventDefault();
                        this.mouseClicked = false;

                        if (this.isWasmEngineValid()) {
                            try {
                                this.wasmEngine.update_mouse(
                                    this.mouseX,
                                    this.mouseY,
                                    this.mouseClicked
                                );
                                this.wasmEngine.fire_mouse_click_cancled();
                            } catch (err) {
                                console.warn('WASM touch end error:', err);
                            }
                        }
                    });
                }

                // Convert mouse event to Entry coordinates
                updateMousePosition(e) {
                    const rect = this.canvas.getBoundingClientRect();
                    const canvasX = e.clientX - rect.left;
                    const canvasY = e.clientY - rect.top;

                    // Convert to Entry coordinate system:
                    // Canvas (0,0) to (480,360) -> Entry (-240,180) to (240,-180)
                    this.mouseX = (canvasX / rect.width) * 480 - 240;
                    this.mouseY = 180 - (canvasY / rect.height) * 360;
                }

                // Convert touch event to Entry coordinates
                updateTouchPosition(touch) {
                    const rect = this.canvas.getBoundingClientRect();
                    const canvasX = touch.clientX - rect.left;
                    const canvasY = touch.clientY - rect.top;

                    this.mouseX = (canvasX / rect.width) * 480 - 240;
                    this.mouseY = 180 - (canvasY / rect.height) * 360;
                }

                updateProgress(percent, text) {
                    document.getElementById('loading-progress-bar').style.width = percent + '%';
                    document.getElementById('loading-text').textContent = text;
                }

                hideLoading() {
                    document.getElementById('loading').classList.add('hidden');
                }

                showError(message) {
                    const errorDiv = document.getElementById('error');
                    errorDiv.textContent = message;
                    errorDiv.style.display = 'block';
                    document.getElementById('loading').classList.add('hidden');
                }

                // 에러 객체를 문자열로 포맷팅
                formatError(error) {
                    if (!error) return '알 수 없는 에러 (null)';
                    if (typeof error === 'string') return error;
                    if (error.message) return error.message;
                    if (error.toString && error.toString() !== '[object Object]')
                        return error.toString();
                    try {
                        return JSON.stringify(error);
                    } catch (e) {
                        return '에러 객체를 문자열로 변환할 수 없음';
                    }
                }
            }

            // Start player
            const player = new EntryPlayer();
            player.initialize();
        </script>
    </body>
</html>
