<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Entry Player (WASM)</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family: 'Noto Sans KR', sans-serif;
            }

            #loading {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                transition: opacity 0.5s ease;
            }

            #loading.hidden {
                opacity: 0;
                pointer-events: none;
            }

            .spinner {
                width: 60px;
                height: 60px;
                border: 4px solid rgba(255, 255, 255, 0.1);
                border-top: 4px solid #00d4ff;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            #loading-text {
                color: #fff;
                margin-top: 20px;
                font-size: 18px;
                text-shadow: 0 2px 10px rgba(0, 212, 255, 0.5);
            }

            #loading-progress {
                width: 200px;
                height: 4px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 2px;
                margin-top: 15px;
                overflow: hidden;
            }

            #loading-progress-bar {
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, #00d4ff, #00ff88);
                transition: width 0.3s ease;
            }

            #canvas-container {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }

            #entryCanvas {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            #error {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(255, 50, 50, 0.9);
                color: white;
                padding: 30px 50px;
                border-radius: 10px;
                text-align: center;
                display: none;
                z-index: 2000;
            }

            #controls {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 10px;
                z-index: 100;
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            #canvas-container:hover #controls {
                opacity: 1;
            }

            .control-btn {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                border: none;
                background: rgba(255, 255, 255, 0.2);
                color: white;
                font-size: 20px;
                cursor: pointer;
                backdrop-filter: blur(10px);
                transition: all 0.2s ease;
            }

            .control-btn:hover {
                background: rgba(255, 255, 255, 0.4);
                transform: scale(1.1);
            }

            .control-btn.active {
                background: #00d4ff;
            }
        </style>
    </head>
    <body>
        <div id="loading">
            <div class="spinner"></div>
            <div id="loading-text">프로젝트 로딩 중...</div>
            <div id="loading-progress">
                <div id="loading-progress-bar"></div>
            </div>
        </div>

        <div id="error"></div>

        <div id="canvas-container">
            <canvas id="entryCanvas" width="480" height="360"></canvas>
            <div id="controls">
                <button class="control-btn" id="btn-play" title="시작/정지">▶</button>
                <button class="control-btn" id="btn-restart" title="다시 시작">↺</button>
                <button class="control-btn" id="btn-fullscreen" title="전체화면">⛶</button>
            </div>
        </div>

        <!-- WASM Engine -->
        <script type="module">
            // WASM 모듈을 동적으로 로드 (경로 문제 방지)
            let WasmEngine = null;
            let wasmInit = null;

            try {
                const wasmModule = await import('/wasm/entry_wasm.js');
                wasmInit = wasmModule.default;
                WasmEngine = wasmModule.WasmEngine;
                console.log('WASM 모듈 import 성공');
            } catch (importError) {
                console.warn('WASM 모듈 import 실패:', importError);
            }

            // Image cache for sprites
            const imageCache = new Map();

            // Constants
            const RENDER_STRIDE = 16;

            // Brush drawing helper
            class BrushState {
                constructor() {
                    this.down = false;
                    this.color = '#ff0000';
                    this.size = 1;
                    this.opacity = 0;
                    this.lastX = null;
                    this.lastY = null;
                    // Fill state
                    this.fillDown = false;
                    this.fillColor = '#ff0000';
                    this.fillPath = []; // Array of {x, y} points for polygon
                }
            }

            class EntryPlayer {
                constructor() {
                    this.projectId = null;
                    this.projectData = null;
                    this.wasmEngine = null;
                    this.canvas = document.getElementById('entryCanvas');
                    this.ctx = this.canvas.getContext('2d');
                    this.isRunning = false;
                    this.animationId = null;

                    // Mouse state for WASM engine
                    this.mouseX = 0;
                    this.mouseY = 0;
                    this.mouseClicked = false;

                    // WASM initialization state
                    this.wasmInitialized = false;
                    this.wasmMemory = null;

                    // Brush drawing state - per entity canvas layers
                    this.brushCanvases = new Map(); // entity_id -> canvas
                    this.brushContexts = new Map(); // entity_id -> context
                    this.brushStates = new Map(); // entity_id -> BrushState
                    this.entityOrder = []; // entity order for z-index (first = bottom)

                    // Scene management
                    this.scenes = []; // Array of scene objects {id, name}
                    this.currentSceneId = null; // Currently active scene ID
                    this.allObjects = []; // All objects from project (parsed)
                    this.sceneObjectsMap = new Map(); // sceneId -> array of objects
                    this.dialogs = new Map(); // entityId -> { message, mode }
                }

                async initialize() {
                    this.updateProgress(10, 'WASM 엔진 초기화 중...');

                    try {
                        // Initialize WASM (모듈이 로드된 경우에만)
                        if (wasmInit && WasmEngine) {
                            console.log('WASM init() 호출 중...');
                            const wasmInstance = await wasmInit();
                            this.wasmMemory = wasmInstance.memory;
                            this.wasmEngine = new WasmEngine();
                            this.wasmInitialized = true;
                            console.log('WASM 엔진 인스턴스 생성 완료');
                            this.updateProgress(30, 'WASM 엔진 준비 완료');
                        } else {
                            console.warn('WASM 모듈이 로드되지 않음, JS 폴백 사용');
                            this.wasmInitialized = false;
                        }
                    } catch (e) {
                        console.warn('WASM 초기화 실패, JS 폴백 사용:', e);
                        this.wasmEngine = null;
                        this.wasmInitialized = false;
                    }

                    // Get project ID from URL
                    const params = new URLSearchParams(window.location.search);
                    this.projectId = params.get('id');

                    if (!this.projectId) {
                        this.showError(
                            '프로젝트 ID가 필요합니다. URL에 ?id=프로젝트ID 형식으로 입력해주세요.'
                        );
                        return;
                    }

                    this.updateProgress(40, '프로젝트 데이터 로딩 중...');

                    try {
                        await this.loadProject();
                    } catch (error) {
                        console.error('loadProject 단계 에러:', error);
                        this.showError(
                            '프로젝트 로딩 실패 (loadProject): ' + this.formatError(error)
                        );
                        return;
                    }

                    try {
                        this.updateProgress(80, '프로젝트 초기화 중...');
                        await this.initializeProject();
                    } catch (error) {
                        console.error('initializeProject 단계 에러:', error);
                        this.showError(
                            '프로젝트 초기화 실패 (initializeProject): ' + this.formatError(error)
                        );
                        return;
                    }

                    try {
                        this.updateProgress(90, '이미지 로딩 중...');
                        await this.preloadImages();
                    } catch (error) {
                        console.error('preloadImages 단계 에러:', error);
                        // 이미지 로딩 실패는 치명적이지 않으므로 경고만 표시
                        console.warn('일부 이미지 로딩 실패, 계속 진행합니다');
                    }

                    this.updateProgress(100, '완료!');

                    setTimeout(() => {
                        this.hideLoading();
                        this.start();
                    }, 500);

                    this.setupControls();
                }

                async loadProject() {
                    try {
                        // Step 1: Fetch CSRF token and cookie from playentry.org
                        this.updateProgress(45, 'CSRF 토큰 획득 중...');
                        this.entryCookie = ''; // 쿠키 초기화
                        const csrfToken = await this.getSessionData();

                        if (!csrfToken) {
                            console.warn(
                                'CSRF 토큰을 획득하지 못했습니다. 요청이 실패할 수 있습니다.'
                            );
                        }

                        // Step 2: Fetch project data via GraphQL
                        this.updateProgress(55, 'GraphQL 데이터 요청 중...');
                        this.projectData = await this.fetchProjectData(csrfToken);

                        // Step 3: Validate project data
                        this.updateProgress(70, '프로젝트 데이터 검증 중...');
                        if (!this.projectData) {
                            throw new Error('프로젝트 데이터가 null/undefined입니다');
                        }

                        if (typeof this.projectData !== 'object') {
                            throw new Error(
                                `프로젝트 데이터 타입이 잘못됨: ${typeof this.projectData}`
                            );
                        }

                        if (!this.projectData.id) {
                            throw new Error(
                                `프로젝트 ID가 없습니다. 받은 데이터: ${JSON.stringify(this.projectData).substring(0, 200)}`
                            );
                        }

                        console.log(
                            '프로젝트 로드 성공:',
                            this.projectData.name,
                            'ID:',
                            this.projectData.id
                        );
                    } catch (error) {
                        console.error('loadProject 에러:', error);
                        throw error;
                    }
                }

                async getSessionData() {
                    try {
                        // Try to get CSRF token and cookie from the page via server proxy
                        const response = await fetch(`/api/playentry/iframe/${this.projectId}`);

                        // 서버에서 캐치한 쿠키 가져오기
                        const entryCookie = response.headers.get('X-Entry-Cookie') || '';
                        if (entryCookie) {
                            console.log('쿠키 획득 성공:', entryCookie.substring(0, 30) + '...');
                            this.entryCookie = entryCookie;
                        }

                        const html = await response.text();

                        // Extract CSRF token from meta tag: <meta name="csrf-token" content="..."/>
                        const csrfMatch = html.match(
                            /<meta\s+name=["']csrf-token["']\s+content=["']([^"']+)["']/i
                        );

                        if (csrfMatch) {
                            console.log(
                                'CSRF 토큰 획득 성공:',
                                csrfMatch[1].substring(0, 10) + '...'
                            );
                            return csrfMatch[1];
                        }

                        // Fallback: try other patterns
                        const altMatch = html.match(/csrf['"]?\s*[:\s]+\s*['"]([^'"]+)['"]/i);
                        if (altMatch) {
                            console.log(
                                'CSRF 토큰 (대체 패턴):',
                                altMatch[1].substring(0, 10) + '...'
                            );
                            return altMatch[1];
                        }

                        console.warn('CSRF 토큰을 찾을 수 없음');
                        return '';
                    } catch (e) {
                        console.warn('CSRF 토큰 획득 실패:', e);
                        return '';
                    }
                }

                async fetchProjectData(csrfToken) {
                    const query = `
                query SELECT_PROJECT($id: ID! $groupId: ID) {
                    project(id: $id, groupId: $groupId) {


                id
                name
                user {

                id
                nickname
                profileImage {

                id
                name
                label {

                ko
                en
                ja
                vn

                }
                filename
                imageType
                dimension {

                width
                height

                }
                trimmed {
                    filename
                    width
                    height
                }

                }
                status {
                    following
                    follower
                }
                description
                role
                mark {

                id
                name
                label {

                ko
                en
                ja
                vn

                }
                filename
                imageType
                dimension {

                width
                height

                }
                trimmed {
                    filename
                    width
                    height
                }

                }

                }
                thumb
                isopen
                showComment
                blamed
                isPracticalCourse
                category
                categoryCode
                created
                updated
                special
                isForLecture
                isForStudy
                isForSubmit
                hashId
                complexity
                staffPicked
                ranked
                visit
                likeCnt
                comment
                favorite
                shortenUrl
                parent {
                    id
                    name
                    user {
                        id
                        nickname
                    }
                }
                description
                description2
                description3
                hasRealTimeVariable
                blockCategoryUsage
                childCnt
                commentGroup {
                    group
                    count
                }
                likeCntGroup {
                    group
                    count
                }
                visitGroup {
                    group
                    count
                }
                recentGroup {
                    group
                    count
                }
                published
                isFirstPublish
                tags

                speed
                objects
                variables
                submitId {
                    id
                }
                cloudVariable
                messages
                functions
                tables
                scenes
                realTimeVariable {

                variableType
                key
                value
                array {
                    key
                    data
                }
                minValue
                maxValue
                visible
                x
                y
                width
                height
                object

                }
                learning
                expansionBlocks
                aiUtilizeBlocks
                hardwareLiteBlocks
                blockCategoryUsage

                    }
                 }
            `;

                    const headers = {
                        'Content-Type': 'application/json',
                        Accept: '*/*',
                        'x-client-type': 'Client',
                    };

                    if (csrfToken) {
                        headers['csrf-token'] = csrfToken;
                    }

                    // 쿠키도 함께 전송
                    if (this.entryCookie) {
                        headers['x-entry-cookie'] = this.entryCookie;
                    }

                    // Use server proxy to avoid CORS issues - /graphql/SELECT_PROJECT 엔드포인트 사용
                    const response = await fetch(
                        `/api/playentry/graphql/SELECT_PROJECT?id=${this.projectId}`,
                        {
                            method: 'POST',
                            headers: headers,
                            credentials: 'include',
                            body: JSON.stringify({
                                query: query,
                                variables: { id: this.projectId },
                            }),
                        }
                    );

                    const responseText = await response.text();
                    console.log('GraphQL 응답 상태:', response.status);
                    console.log('GraphQL 응답 미리보기:', responseText.substring(0, 300));

                    if (!response.ok) {
                        console.error('GraphQL 요청 실패:', response.status, responseText);

                        // JSON 에러 응답인지 확인
                        try {
                            const errorData = JSON.parse(responseText);
                            const errorMsg =
                                errorData.error || errorData.message || `HTTP ${response.status}`;
                            const detail = errorData.detail || '';
                            throw new Error(`${errorMsg}${detail ? ' - ' + detail : ''}`);
                        } catch (parseErr) {
                            throw new Error(
                                `HTTP ${response.status}: ${responseText.substring(0, 100)}`
                            );
                        }
                    }

                    // JSON 파싱
                    let project;
                    try {
                        project = JSON.parse(responseText);
                    } catch (parseErr) {
                        console.error('JSON 파싱 실패:', parseErr);
                        throw new Error(`JSON 파싱 실패: ${responseText.substring(0, 100)}`);
                    }

                    console.log('파싱된 프로젝트 데이터:', project);
                    console.log('프로젝트 데이터 타입:', typeof project);
                    console.log('프로젝트 키들:', project ? Object.keys(project) : 'null');

                    // 에러 체크
                    if (project && project.error) {
                        const detail = project.detail || '';
                        throw new Error(
                            `서버 에러: ${project.error}${detail ? ' (' + detail + ')' : ''}`
                        );
                    }

                    if (project && project.errors && Array.isArray(project.errors)) {
                        throw new Error(
                            `GraphQL 에러: ${project.errors[0]?.message || JSON.stringify(project.errors)}`
                        );
                    }

                    // 프로젝트 데이터 유효성 검사
                    if (!project || typeof project !== 'object') {
                        throw new Error(`잘못된 프로젝트 데이터 형식: ${typeof project}`);
                    }

                    // 서버에서 이미 project 객체만 추출해서 반환함
                    return project;
                }

                async initializeProject() {
                    if (!this.projectData) {
                        throw new Error('프로젝트 데이터가 없습니다');
                    }

                    // Initialize scene management first
                    this.initializeScenes(this.projectData);

                    // Get objects for current scene (or all objects if no scenes)
                    let objects = this.getCurrentSceneObjects();
                    console.log(
                        'objects 준비 완료:',
                        objects ? `${objects.length}개 오브젝트 (현재 장면)` : 'null/undefined'
                    );

                    // Initialize canvas size
                    this.canvas.width = 480;
                    this.canvas.height = 360;

                    // Initialize entity order from objects array (reverse order: first object = top layer)
                    this.entityOrder = [];
                    for (let i = objects.length - 1; i >= 0; i--) {
                        this.entityOrder.push(i);
                    }

                    // Initialize fill canvas (separate layer for real-time fill preview)
                    this.fillCanvas = document.createElement('canvas');
                    this.fillCanvas.width = 480;
                    this.fillCanvas.height = 360;
                    this.fillCtx = this.fillCanvas.getContext('2d');

                    // Scale canvas to fit screen
                    this.resizeCanvas();
                    window.addEventListener('resize', () => this.resizeCanvas());

                    // Load sprites and initialize engine
                    if (this.wasmEngine) {
                        try {
                            console.log('WASM 엔진에 프로젝트 로드 시도...');

                            // WASM에 전달하기 전에 문자열로 된 필드들을 파싱
                            const projectForWasm = this.prepareProjectForWasm(this.projectData);
                            console.log('WASM용 프로젝트 데이터 준비 완료');

                            this.wasmEngine.load_project(JSON.stringify(projectForWasm));

                            // Debug logging for performance verification
                            console.group(
                                '%c🚀 WASM Engine Status',
                                'color: #00ff00; font-weight: bold; font-size: 14px;'
                            );
                            console.log('%c✅ Zero-copy Interface:', 'color: #00d4ff', 'Ready');
                            console.log(
                                '%c✅ Memory Buffer:',
                                'color: #00d4ff',
                                this.wasmMemory
                                    ? `${this.wasmMemory.buffer.byteLength.toLocaleString()} bytes`
                                    : 'Not linked'
                            );

                            if (typeof this.wasmEngine.get_debug_info === 'function') {
                                console.log(
                                    '%c📦 VM Compilation Result:',
                                    'color: #ff00d4',
                                    '\n' + this.wasmEngine.get_debug_info()
                                );
                            }

                            // Check pointer explicitly
                            const ptr = this.wasmEngine.get_render_buffer_ptr();
                            const len = this.wasmEngine.get_render_buffer_len();
                            console.log(
                                `%c🎨 Render Buffer: ptr=${ptr}, len=${len} (doubles)`,
                                'color: #eebb00'
                            );
                            console.groupEnd();

                            console.log('WASM 엔진 프로젝트 로드 완료');
                        } catch (wasmError) {
                            console.error('WASM 엔진 프로젝트 로드 실패:', wasmError);
                            console.warn('JS 폴백 엔진으로 전환합니다');
                            this.wasmEngine = null;
                            this.initJSEngine(objects);
                        }
                    } else {
                        // Fallback to JS engine
                        this.initJSEngine(objects);
                    }
                }

                initJSEngine(objects) {
                    // Simple JS fallback engine
                    this.jsEngine = {
                        objects: objects || [],
                        variables: {},
                        running: false,
                        tick: 0,
                    };
                }

                // Initialize scene management from project data
                initializeScenes(projectData) {
                    // Parse scenes
                    let scenes = projectData.scenes;
                    if (typeof scenes === 'string') {
                        try {
                            scenes = JSON.parse(scenes);
                        } catch (e) {
                            console.warn('scenes 파싱 실패:', e);
                            scenes = [];
                        }
                    }
                    this.scenes = scenes || [];

                    // Parse all objects
                    let objects = projectData.objects;
                    if (typeof objects === 'string') {
                        try {
                            objects = JSON.parse(objects);
                        } catch (e) {
                            console.warn('objects 파싱 실패:', e);
                            objects = [];
                        }
                    }
                    this.allObjects = objects || [];

                    // Build scene -> objects mapping
                    this.sceneObjectsMap.clear();
                    for (const scene of this.scenes) {
                        this.sceneObjectsMap.set(scene.id, []);
                    }

                    for (const obj of this.allObjects) {
                        const sceneId = obj.scene;
                        if (sceneId && this.sceneObjectsMap.has(sceneId)) {
                            this.sceneObjectsMap.get(sceneId).push(obj);
                        } else if (this.scenes.length > 0) {
                            // Default to first scene if no scene specified
                            const firstSceneId = this.scenes[0].id;
                            if (!this.sceneObjectsMap.has(firstSceneId)) {
                                this.sceneObjectsMap.set(firstSceneId, []);
                            }
                            this.sceneObjectsMap.get(firstSceneId).push(obj);
                        }
                    }

                    // Set initial scene (first scene)
                    if (this.scenes.length > 0) {
                        this.currentSceneId = this.scenes[0].id;
                    }

                    console.log(`장면 초기화 완료: ${this.scenes.length}개 장면`);
                    for (const scene of this.scenes) {
                        const objCount = this.sceneObjectsMap.get(scene.id)?.length || 0;
                        console.log(`  - ${scene.name} (${scene.id}): ${objCount}개 오브젝트`);
                    }
                }

                // Get objects for current scene
                getCurrentSceneObjects() {
                    if (!this.currentSceneId) {
                        return this.allObjects;
                    }
                    return this.sceneObjectsMap.get(this.currentSceneId) || [];
                }

                // Switch to a specific scene by ID
                switchToScene(sceneId) {
                    const scene = this.scenes.find((s) => s.id === sceneId);
                    if (!scene) {
                        console.warn(`장면을 찾을 수 없음: ${sceneId}`);
                        return false;
                    }

                    console.log(`장면 전환: ${scene.name} (${sceneId})`);
                    this.currentSceneId = sceneId;

                    // Get objects for the new scene
                    const sceneObjects = this.getCurrentSceneObjects();

                    // Update entity order for the new scene
                    this.entityOrder = [];
                    for (let i = sceneObjects.length - 1; i >= 0; i--) {
                        this.entityOrder.push(i);
                    }

                    // Reload WASM engine with new scene's objects
                    if (this.isWasmEngineValid()) {
                        try {
                            // Save current variable state before switching
                            let savedVariables = null;
                            if (typeof this.wasmEngine.get_variables === 'function') {
                                try {
                                    savedVariables = this.wasmEngine.get_variables();
                                } catch (e) {
                                    console.warn('변수 상태 저장 실패:', e);
                                }
                            }

                            // Create project data for just this scene
                            const sceneProjectData = this.createSceneProjectData(sceneId);

                            // Stop current execution
                            this.wasmEngine.stop();

                            // Load new scene data
                            this.wasmEngine.load_project(JSON.stringify(sceneProjectData));

                            // Restore variable state after loading new scene
                            if (
                                savedVariables &&
                                typeof this.wasmEngine.set_variables === 'function'
                            ) {
                                try {
                                    this.wasmEngine.set_variables(savedVariables);
                                } catch (e) {
                                    console.warn('변수 상태 복원 실패:', e);
                                }
                            }

                            // Start scene (fires only when_scene_start, not when_run_button_click)
                            this.wasmEngine.start_scene();

                            console.log(
                                `WASM 엔진에 장면 로드 완료: ${sceneObjects.length}개 오브젝트`
                            );
                        } catch (e) {
                            console.error('장면 전환 중 WASM 오류:', e);
                            return false;
                        }
                    }

                    // Preload images for new scene
                    this.preloadSceneImages(sceneObjects);

                    return true;
                }

                // Create project data for a specific scene
                createSceneProjectData(sceneId) {
                    const sceneObjects = this.sceneObjectsMap.get(sceneId) || [];

                    // Parse and prepare objects (same as prepareProjectForWasm but for specific scene)
                    const preparedObjects = sceneObjects.map((obj) => {
                        const newObj = { ...obj };
                        if (typeof newObj.script === 'string') {
                            try {
                                newObj.script = JSON.parse(newObj.script);
                            } catch (e) {
                                newObj.script = [];
                            }
                        }
                        return newObj;
                    });

                    // Get variables and functions from original project
                    let variables = this.projectData.variables;
                    if (typeof variables === 'string') {
                        try {
                            variables = JSON.parse(variables);
                        } catch (e) {
                            variables = [];
                        }
                    }

                    let functions = this.projectData.functions;
                    if (typeof functions === 'string') {
                        try {
                            functions = JSON.parse(functions);
                        } catch (e) {
                            functions = [];
                        }
                    }

                    let messages = this.projectData.messages;
                    if (typeof messages === 'string') {
                        try {
                            messages = JSON.parse(messages);
                        } catch (e) {
                            messages = [];
                        }
                    }

                    return {
                        id: this.projectData.id,
                        name: this.projectData.name,
                        speed: this.projectData.speed || 60,
                        objects: preparedObjects,
                        variables: variables || [],
                        functions: functions || [],
                        messages: messages || [],
                        scenes: this.scenes,
                    };
                }

                // Preload images for a set of objects
                async preloadSceneImages(objects) {
                    for (const obj of objects) {
                        if (obj.sprite?.pictures) {
                            for (const pic of obj.sprite.pictures) {
                                if (pic.id && !imageCache.has(pic.id)) {
                                    this.loadPictureImage(pic);
                                }
                            }
                        }
                    }
                }

                // Load a single picture image
                loadPictureImage(pic) {
                    if (!pic.fileurl && !pic.filename) return;

                    let originalUrl = pic.fileurl;
                    if (!originalUrl && pic.filename) {
                        originalUrl = `uploads/${pic.filename.substring(0, 2)}/${pic.filename.substring(2, 4)}/image/${pic.filename}.png`;
                    }

                    let proxyUrl;
                    if (originalUrl.startsWith('http://') || originalUrl.startsWith('https://')) {
                        proxyUrl = originalUrl
                            .replace('https://playentry.org/', '/api/playentry/image/')
                            .replace('http://playentry.org/', '/api/playentry/image/');
                    } else {
                        proxyUrl = `/api/playentry/image/${originalUrl}`;
                    }

                    const img = new Image();
                    img.onload = () => console.log(`이미지 로드 완료: ${pic.id}`);
                    img.onerror = () => console.warn(`이미지 로드 실패: ${pic.id}`);
                    img.src = proxyUrl;
                    imageCache.set(pic.id, img);
                }

                // Switch to next scene
                switchToNextScene() {
                    const currentIndex = this.scenes.findIndex((s) => s.id === this.currentSceneId);
                    if (currentIndex >= 0 && currentIndex < this.scenes.length - 1) {
                        return this.switchToScene(this.scenes[currentIndex + 1].id);
                    }
                    console.log('다음 장면이 없습니다');
                    return false;
                }

                // Switch to previous scene
                switchToPreviousScene() {
                    const currentIndex = this.scenes.findIndex((s) => s.id === this.currentSceneId);
                    if (currentIndex > 0) {
                        return this.switchToScene(this.scenes[currentIndex - 1].id);
                    }
                    console.log('이전 장면이 없습니다');
                    return false;
                }

                // playentry.org API에서 받은 데이터를 WASM 엔진용으로 변환
                // objects, variables, functions 등이 문자열로 되어 있으면 파싱
                // 현재 장면의 오브젝트만 포함
                prepareProjectForWasm(projectData) {
                    const prepared = { ...projectData };

                    // variables 필드 파싱
                    if (typeof prepared.variables === 'string') {
                        try {
                            prepared.variables = JSON.parse(prepared.variables);
                            console.log('variables 문자열 파싱 완료');
                        } catch (e) {
                            console.error('variables 파싱 실패:', e);
                            prepared.variables = [];
                        }
                    }

                    // functions 필드 파싱
                    if (typeof prepared.functions === 'string') {
                        try {
                            prepared.functions = JSON.parse(prepared.functions);
                            console.log('functions 문자열 파싱 완료');
                        } catch (e) {
                            console.error('functions 파싱 실패:', e);
                            prepared.functions = [];
                        }
                    }

                    // messages 필드 파싱
                    if (typeof prepared.messages === 'string') {
                        try {
                            prepared.messages = JSON.parse(prepared.messages);
                        } catch (e) {
                            prepared.messages = [];
                        }
                    }

                    // scenes 필드 파싱
                    if (typeof prepared.scenes === 'string') {
                        try {
                            prepared.scenes = JSON.parse(prepared.scenes);
                        } catch (e) {
                            prepared.scenes = [];
                        }
                    }

                    // tables 필드 파싱
                    if (typeof prepared.tables === 'string') {
                        try {
                            prepared.tables = JSON.parse(prepared.tables);
                        } catch (e) {
                            prepared.tables = [];
                        }
                    }

                    // 현재 장면의 오브젝트만 사용 (장면이 초기화된 경우)
                    if (this.currentSceneId && this.sceneObjectsMap.size > 0) {
                        const sceneObjects = this.getCurrentSceneObjects();
                        prepared.objects = sceneObjects.map((obj) => {
                            const newObj = { ...obj };
                            if (typeof newObj.script === 'string') {
                                try {
                                    newObj.script = JSON.parse(newObj.script);
                                } catch (e) {
                                    console.warn('object script 파싱 실패:', obj.id, e);
                                    newObj.script = [];
                                }
                            }
                            return newObj;
                        });
                        console.log(
                            'objects 현재 장면 필터링 완료:',
                            prepared.objects.length,
                            '개 오브젝트'
                        );
                    } else {
                        // 장면 초기화 전이면 전체 오브젝트 사용
                        if (typeof prepared.objects === 'string') {
                            try {
                                prepared.objects = JSON.parse(prepared.objects);
                            } catch (e) {
                                console.error('objects 파싱 실패:', e);
                                prepared.objects = [];
                            }
                        }

                        if (Array.isArray(prepared.objects)) {
                            prepared.objects = prepared.objects.map((obj) => {
                                const newObj = { ...obj };
                                if (typeof newObj.script === 'string') {
                                    try {
                                        newObj.script = JSON.parse(newObj.script);
                                    } catch (e) {
                                        console.warn('object script 파싱 실패:', obj.id, e);
                                        newObj.script = [];
                                    }
                                }
                                return newObj;
                            });
                        }
                        console.log(
                            'objects 문자열 파싱 완료:',
                            prepared.objects?.length || 0,
                            '개 오브젝트'
                        );
                    }

                    return prepared;
                }

                resizeCanvas() {
                    const container = document.getElementById('canvas-container');
                    const aspectRatio = 480 / 360;

                    let width = container.clientWidth;
                    let height = container.clientHeight;

                    if (width / height > aspectRatio) {
                        width = height * aspectRatio;
                    } else {
                        height = width / aspectRatio;
                    }

                    this.canvas.style.width = width + 'px';
                    this.canvas.style.height = height + 'px';
                }

                start() {
                    this.isRunning = true;
                    document.getElementById('btn-play').textContent = '⏸';
                    document.getElementById('btn-play').classList.add('active');

                    if (this.wasmEngine) {
                        this.wasmEngine.start();
                    }

                    this.gameLoop();
                }

                stop() {
                    this.isRunning = false;
                    document.getElementById('btn-play').textContent = '▶';
                    document.getElementById('btn-play').classList.remove('active');

                    if (this.animationId) {
                        cancelAnimationFrame(this.animationId);
                    }

                    if (this.wasmEngine) {
                        this.wasmEngine.stop();
                    }
                }

                toggle() {
                    if (this.isRunning) {
                        this.stop();
                    } else {
                        this.start();
                    }
                }

                restart() {
                    this.stop();

                    // Reset to first scene
                    if (this.scenes.length > 0) {
                        this.currentSceneId = this.scenes[0].id;
                        // Update entity order for first scene
                        const sceneObjects = this.getCurrentSceneObjects();
                        this.entityOrder = [];
                        for (let i = sceneObjects.length - 1; i >= 0; i--) {
                            this.entityOrder.push(i);
                        }
                    }

                    // Clear all brush canvases on restart
                    for (const [entityId, canvas] of this.brushCanvases) {
                        const ctx = this.brushContexts.get(entityId);
                        if (ctx) {
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                        }
                    }
                    // Clear fill canvas on restart
                    if (this.fillCtx) {
                        this.fillCtx.clearRect(0, 0, this.fillCanvas.width, this.fillCanvas.height);
                    }
                    this.brushStates.clear();

                    // Reset error flags for fresh start
                    this._firstRenderLogged = false;
                    this._jsActionsErrorLogged = false;
                    this._jsActionsParseErrorLogged = false;
                    this._brushStampErrorLogged = false;
                    this._renderErrorLogged = false;
                    this._renderDataErrorLogged = false;
                    this._tickErrorLogged = false;
                    this._renderErrorCount = 0;

                    // WASM 엔진 reset (재생성보다 안전)
                    if (this.wasmEngine && this.wasmInitialized) {
                        try {
                            // 먼저 reset 시도
                            this.wasmEngine.reset();
                            console.log('WASM 엔진 reset 완료');
                        } catch (e) {
                            console.error('WASM reset 실패:', e);
                            // reset 실패 시 엔진 재생성 시도
                            if (this.projectData && WasmEngine) {
                                try {
                                    // 기존 엔진 명시적 해제
                                    try {
                                        this.wasmEngine.free();
                                    } catch (freeError) {
                                        // free 실패는 무시 (이미 해제되었을 수 있음)
                                    }

                                    // 새 엔진 생성
                                    this.wasmEngine = new WasmEngine();
                                    const projectForWasm = this.prepareProjectForWasm(
                                        this.projectData
                                    );
                                    this.wasmEngine.load_project(JSON.stringify(projectForWasm));
                                    console.log('WASM 엔진 재생성 완료');
                                } catch (recreateError) {
                                    console.error('WASM 엔진 재생성 실패:', recreateError);
                                    this.wasmEngine = null;
                                    this.wasmInitialized = false;
                                }
                            } else {
                                this.wasmEngine = null;
                                this.wasmInitialized = false;
                            }
                        }
                    }

                    setTimeout(() => this.start(), 100);
                }

                isWasmEngineValid() {
                    return (
                        this.wasmEngine &&
                        this.wasmInitialized &&
                        this.wasmEngine.__wbg_ptr !== 0 &&
                        this.wasmEngine.__wbg_ptr !== undefined
                    );
                }

                gameLoop() {
                    if (!this.isRunning) return;

                    // Update mouse state in WASM engine
                    if (this.isWasmEngineValid()) {
                        try {
                            this.wasmEngine.update_mouse(
                                this.mouseX,
                                this.mouseY,
                                this.mouseClicked
                            );
                            this.wasmEngine.tick();

                            // Process JS actions from WASM (brush, sound, etc.)
                            this.handleJsActions();
                        } catch (e) {
                            // WASM tick failed - likely engine is in bad state
                            if (!this._tickErrorLogged) {
                                this._tickErrorLogged = true;
                                console.error('WASM tick() 실패, JS 폴백으로 전환:', e);
                            }
                            // Disable WASM engine and fall back to JS
                            this.wasmEngine = null;
                            this.wasmInitialized = false;
                            // Initialize JS fallback if not already done
                            if (!this.jsEngine && this.projectData?.objects) {
                                const objects =
                                    typeof this.projectData.objects === 'string'
                                        ? JSON.parse(this.projectData.objects)
                                        : this.projectData.objects;
                                this.initJSEngine(objects);
                            }
                        }
                    } else if (this.jsEngine) {
                        this.jsEngine.tick++;
                    }

                    // Render
                    this.render();

                    this.animationId = requestAnimationFrame(() => this.gameLoop());
                }

                // Handle JS actions from WASM engine
                handleJsActions() {
                    // Guard: check WASM engine exists and pointer is valid
                    if (!this.isWasmEngineValid()) return;

                    // Check if get_js_actions function exists (WASM may not have it exported)
                    if (typeof this.wasmEngine.get_js_actions !== 'function') {
                        return; // Function not available in WASM binary
                    }

                    let actionsJson;
                    try {
                        actionsJson = this.wasmEngine.get_js_actions();
                    } catch (e) {
                        // WASM call failed (possibly RuntimeError: unreachable) - log once and continue
                        if (!this._jsActionsErrorLogged) {
                            this._jsActionsErrorLogged = true;
                            console.warn('get_js_actions() 호출 실패:', e);
                        }
                        return;
                    }
                    if (!actionsJson || actionsJson === '[]') return;

                    try {
                        const actions = JSON.parse(actionsJson);
                        for (const action of actions) {
                            this.processJsAction(action);
                        }
                    } catch (e) {
                        // Log parse error only once to prevent console flood
                        if (!this._jsActionsParseErrorLogged) {
                            this._jsActionsParseErrorLogged = true;
                            console.error('Failed to parse JS actions:', e);
                        }
                    }
                }

                processJsAction(action) {
                    const { type, data } = action;

                    switch (type) {
                        case 'BrushStamp': {
                            const entityId = data.entity_id;
                            this.handleBrushStamp(entityId);
                            break;
                        }
                        case 'BrushEraseAll': {
                            const entityId = data.entity_id;
                            this.handleBrushEraseAll(entityId);
                            break;
                        }
                        case 'StartDrawing': {
                            const { entity_id, x, y } = data;
                            this.handleStartDrawing(entity_id, x, y);
                            break;
                        }
                        case 'StopDrawing': {
                            const entityId = data.entity_id;
                            this.handleStopDrawing(entityId);
                            break;
                        }
                        case 'SetBrushColor': {
                            const { entity_id, color } = data;
                            this.handleSetBrushColor(entity_id, color);
                            break;
                        }
                        case 'SetRandomColor': {
                            const entityId = data.entity_id;
                            const randomColor =
                                '#' +
                                Math.floor(Math.random() * 16777215)
                                    .toString(16)
                                    .padStart(6, '0');
                            this.handleSetBrushColor(entityId, randomColor);
                            break;
                        }
                        case 'StartFill': {
                            const { entity_id, x, y } = data;
                            this.handleStartFill(entity_id, x, y);
                            break;
                        }
                        case 'StopFill': {
                            const entityId = data.entity_id;
                            this.handleStopFill(entityId);
                            break;
                        }
                        case 'SetFillColor': {
                            const { entity_id, color } = data;
                            this.handleSetFillColor(entity_id, color);
                            break;
                        }
                        case 'BrushLineTo': {
                            const { entity_id, x, y } = data;
                            this.handleBrushLineTo(entity_id, x, y);
                            break;
                        }
                        case 'FillLineTo': {
                            const { entity_id, x, y } = data;
                            this.handleFillLineTo(entity_id, x, y);
                            break;
                        }
                        case 'BrushPath': {
                            const { entity_id, points } = data;
                            this.handleBrushPath(entity_id, points);
                            break;
                        }
                        case 'FillPath': {
                            const { entity_id, points } = data;
                            this.handleFillPath(entity_id, points);
                            break;
                        }
                        // Scene actions
                        case 'StartScene': {
                            const sceneId = data.scene_id;
                            console.log('StartScene 액션 수신:', sceneId);
                            this.switchToScene(sceneId);
                            break;
                        }
                        case 'StartNextScene': {
                            console.log('StartNextScene 액션 수신');
                            this.switchToNextScene();
                            break;
                        }
                        case 'StartPreviousScene': {
                            console.log('StartPreviousScene 액션 수신');
                            this.switchToPreviousScene();
                            break;
                        }
                        case 'ShowDialog': {
                            const { entity_id, message, mode } = data;
                            this.dialogs.set(entity_id, { message, mode });
                            break;
                        }
                        case 'RemoveDialog': {
                            const { entity_id } = data;
                            this.dialogs.delete(entity_id);
                            break;
                        }
                        default:
                            // Suppress unhandled action logs to prevent console flood
                            // Uncomment the following line for debugging:
                            // if (!this._loggedUnhandledActions?.has(type)) {
                            //     this._loggedUnhandledActions = this._loggedUnhandledActions || new Set();
                            //     this._loggedUnhandledActions.add(type);
                            //     console.log('Unhandled JS action:', type, data);
                            // }
                            break;
                    }
                }

                getBrushState(entityStringId) {
                    if (!this.brushStates.has(entityStringId)) {
                        this.brushStates.set(entityStringId, new BrushState());
                    }
                    return this.brushStates.get(entityStringId);
                }

                getBrushCanvas(entityId) {
                    if (!this.brushCanvases.has(entityId)) {
                        const canvas = document.createElement('canvas');
                        canvas.width = 480;
                        canvas.height = 360;
                        this.brushCanvases.set(entityId, canvas);
                        this.brushContexts.set(entityId, canvas.getContext('2d'));
                    }
                    return this.brushCanvases.get(entityId);
                }

                getBrushCtx(entityId) {
                    this.getBrushCanvas(entityId);
                    return this.brushContexts.get(entityId);
                }

                // Convert entity index to entity.id
                // Note: entity.id from WASM equals entityIndex directly
                getEntityId(entityIndex) {
                    return entityIndex;
                }

                handleBrushStamp(entityId) {
                    if (!this.isWasmEngineValid()) return;
                    let renderData;
                    try {
                        renderData = this.wasmEngine.get_render_data();
                    } catch (e) {
                        return;
                    }
                    if (!renderData) return;

                    try {
                        const entities = JSON.parse(renderData);
                        const entity = entities[entityId];
                        if (!entity || !entity.visible) return;

                        const screenX = 240 + entity.x;
                        const screenY = 180 - entity.y;
                        const img = imageCache.get(entity.pictureId);
                        const ctx = this.getBrushCtx(entityId);

                        ctx.save();
                        ctx.translate(screenX, screenY);
                        ctx.rotate((-entity.rotation * Math.PI) / 180);
                        ctx.scale(entity.scaleX, entity.scaleY);

                        if (img && img.complete && img.naturalWidth > 0) {
                            ctx.drawImage(
                                img,
                                -entity.width / 2,
                                -entity.height / 2,
                                entity.width,
                                entity.height
                            );
                        } else {
                            ctx.fillStyle = entity.color || '#4a90d9';
                            ctx.fillRect(
                                -entity.width / 2,
                                -entity.height / 2,
                                entity.width || 50,
                                entity.height || 50
                            );
                        }

                        ctx.restore();
                    } catch (e) {
                        if (!this._brushStampErrorLogged) {
                            this._brushStampErrorLogged = true;
                            console.error('Failed to handle brush stamp:', e);
                        }
                    }
                }

                handleBrushEraseAll(entityId) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;

                    // Clear brush canvas for this entity
                    const canvas = this.brushCanvases.get(entityKey);
                    if (canvas) {
                        const ctx = this.brushContexts.get(entityKey);
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }

                    // Reset fill state for this entity
                    const brushState = this.brushStates.get(entityKey);
                    if (brushState) {
                        brushState.fillPath = [];
                        brushState.fillDown = false;
                    }
                }

                handleStartDrawing(entityId, x, y) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    brushState.down = true;
                    brushState.lastX = 240 + x;
                    brushState.lastY = 180 - y;
                }

                handleStopDrawing(entityId) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    brushState.down = false;
                    brushState.lastX = null;
                    brushState.lastY = null;
                }

                handleSetBrushColor(entityId, color) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    brushState.color = color;
                }

                handleStartFill(entityId, x, y) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    brushState.fillDown = true;
                    brushState.fillPath = [];
                    this.fillCtx.clearRect(0, 0, this.fillCanvas.width, this.fillCanvas.height);
                    brushState.fillPath.push({ x: 240 + x, y: 180 - y });
                }

                handleStopFill(entityId) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    if (brushState.fillPath.length >= 3) {
                        const ctx = this.getBrushCtx(entityId);
                        ctx.drawImage(this.fillCanvas, 0, 0);
                    }
                    this.fillCtx.clearRect(0, 0, this.fillCanvas.width, this.fillCanvas.height);
                    brushState.fillDown = false;
                    brushState.fillPath = [];
                }

                handleSetFillColor(entityId, color) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    brushState.fillColor = color;
                }

                handleBrushLineTo(entityId, x, y) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    const ctx = this.getBrushCtx(entityId);
                    const screenX = 240 + x;
                    const screenY = 180 - y;
                    if (brushState.lastX !== null && brushState.lastY !== null) {
                        ctx.beginPath();
                        ctx.strokeStyle = brushState.color;
                        ctx.lineWidth = brushState.size;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.globalAlpha = 1 - brushState.opacity / 100;
                        ctx.moveTo(brushState.lastX, brushState.lastY);
                        ctx.lineTo(screenX, screenY);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                    brushState.lastX = screenX;
                    brushState.lastY = screenY;
                }

                handleFillLineTo(entityId, x, y) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    if (!brushState.fillDown) return;
                    const screenX = 240 + x;
                    const screenY = 180 - y;
                    const lastPoint = brushState.fillPath[brushState.fillPath.length - 1];
                    if (lastPoint) {
                        const dx = screenX - lastPoint.x;
                        const dy = screenY - lastPoint.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        if (distance >= 2) {
                            brushState.fillPath.push({ x: screenX, y: screenY });
                            this.drawFillPreview(entityKey);
                        }
                    } else {
                        brushState.fillPath.push({ x: screenX, y: screenY });
                    }
                }

                handleBrushPath(entityId, points) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    const ctx = this.getBrushCtx(entityId);

                    if (points.length === 0) return;

                    ctx.beginPath();
                    ctx.strokeStyle = brushState.color;
                    ctx.lineWidth = brushState.size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.globalAlpha = 1 - brushState.opacity / 100;

                    if (brushState.lastX !== null && brushState.lastY !== null) {
                        ctx.moveTo(brushState.lastX, brushState.lastY);
                    } else {
                        const [firstX, firstY] = points[0];
                        ctx.moveTo(240 + firstX, 180 - firstY);
                    }

                    for (const [x, y] of points) {
                        const screenX = 240 + x;
                        const screenY = 180 - y;
                        ctx.lineTo(screenX, screenY);
                    }
                    ctx.stroke();
                    ctx.globalAlpha = 1;

                    const lastPoint = points[points.length - 1];
                    brushState.lastX = 240 + lastPoint[0];
                    brushState.lastY = 180 - lastPoint[1];
                }

                handleFillPath(entityId, points) {
                    const entityKey = this.getEntityId(entityId);
                    if (entityKey === null) return;
                    const brushState = this.getBrushState(entityKey);
                    if (!brushState.fillDown) return;

                    for (const [x, y] of points) {
                        const screenX = 240 + x;
                        const screenY = 180 - y;
                        const lastPoint = brushState.fillPath[brushState.fillPath.length - 1];
                        if (lastPoint) {
                            const dx = screenX - lastPoint.x;
                            const dy = screenY - lastPoint.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance >= 2) {
                                brushState.fillPath.push({ x: screenX, y: screenY });
                            }
                        } else {
                            brushState.fillPath.push({ x: screenX, y: screenY });
                        }
                    }
                    this.drawFillPreview(entityKey);
                }

                // Draw real-time fill preview on fillCanvas
                drawFillPreview(entityKey) {
                    const brushState = this.brushStates.get(entityKey);
                    if (!brushState || !brushState.fillDown || brushState.fillPath.length < 3) {
                        return;
                    }

                    // Clear fillCanvas and redraw the polygon
                    this.fillCtx.clearRect(0, 0, this.fillCanvas.width, this.fillCanvas.height);

                    this.fillCtx.beginPath();
                    this.fillCtx.moveTo(brushState.fillPath[0].x, brushState.fillPath[0].y);

                    for (let i = 1; i < brushState.fillPath.length; i++) {
                        this.fillCtx.lineTo(brushState.fillPath[i].x, brushState.fillPath[i].y);
                    }

                    this.fillCtx.closePath();
                    this.fillCtx.fillStyle = brushState.fillColor;
                    this.fillCtx.fill();
                }

                updateBrushDrawing(entities) {
                    for (const entity of entities) {
                        const entityKey = entity.id;
                        const brushState = this.getBrushState(entityKey);

                        const wasBrushDown = brushState.down;
                        brushState.down = entity.brushDown || false;
                        brushState.color = entity.brushColor || brushState.color;
                        brushState.size = entity.brushSize || brushState.size;

                        if (!wasBrushDown && brushState.down) {
                            brushState.lastX = null;
                            brushState.lastY = null;
                        }

                        const screenX = 240 + entity.x;
                        const screenY = 180 - entity.y;

                        if (brushState.fillDown) {
                            const lastPoint = brushState.fillPath[brushState.fillPath.length - 1];
                            let pointAdded = false;
                            if (lastPoint) {
                                const dx = screenX - lastPoint.x;
                                const dy = screenY - lastPoint.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance >= 2) {
                                    brushState.fillPath.push({ x: screenX, y: screenY });
                                    pointAdded = true;
                                }
                            } else {
                                brushState.fillPath.push({ x: screenX, y: screenY });
                                pointAdded = true;
                            }
                            if (pointAdded && this.fillCtx) {
                                this.drawFillPreview(entityKey);
                            }
                        }

                        if (!brushState.down) {
                            brushState.lastX = null;
                            brushState.lastY = null;
                            continue;
                        }

                        if (brushState.lastX !== null && brushState.lastY !== null) {
                            const ctx = this.getBrushCtx(entityKey);
                            ctx.beginPath();
                            ctx.strokeStyle = brushState.color;
                            ctx.lineWidth = brushState.size;
                            ctx.lineCap = 'round';
                            ctx.lineJoin = 'round';
                            ctx.globalAlpha = 1 - brushState.opacity / 100;
                            ctx.moveTo(brushState.lastX, brushState.lastY);
                            ctx.lineTo(screenX, screenY);
                            ctx.stroke();
                            ctx.globalAlpha = 1;
                        }

                        brushState.lastX = screenX;
                        brushState.lastY = screenY;
                    }
                }

                render() {
                    this.ctx.fillStyle = '#ffffff';
                    this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                    if (this.isWasmEngineValid()) {
                        try {
                            // Zero-copy rendering
                            const ptr = this.wasmEngine.get_render_buffer_ptr();
                            const len = this.wasmEngine.get_render_buffer_len();

                            if (ptr && len > 0 && this.wasmMemory) {
                                // Log first successful render frame details once
                                if (!this._firstRenderLogged) {
                                    this._firstRenderLogged = true;
                                    console.log(
                                        `%c✨ First Frame Rendered via Zero-copy (ptr: ${ptr}, len: ${len})`,
                                        'color: #00ff00; font-weight: bold;'
                                    );
                                }

                                const buffer = new Float64Array(this.wasmMemory.buffer, ptr, len);
                                this.drawRenderBuffer(buffer);
                                this._renderErrorCount = 0;
                            } else {
                                // Fallback to JSON if buffer is empty/invalid but engine is valid?
                                // Should not happen if everything is correct.
                            }
                        } catch (e) {
                            this._renderErrorCount = (this._renderErrorCount || 0) + 1;
                            if (!this._renderDataErrorLogged) {
                                this._renderDataErrorLogged = true;
                                console.warn('Render error:', e);
                            }
                            if (this._renderErrorCount >= 5) {
                                console.error('WASM render 연속 실패, JS 폴백으로 전환');
                                this.wasmEngine = null;
                                this.wasmInitialized = false;
                                if (!this.jsEngine && this.projectData?.objects) {
                                    const objects =
                                        typeof this.projectData.objects === 'string'
                                            ? JSON.parse(this.projectData.objects)
                                            : this.projectData.objects;
                                    this.initJSEngine(objects);
                                }
                            }
                        }
                    } else if (this.jsEngine) {
                        this.drawJSEngine();
                    }
                }

                drawRenderBuffer(buffer) {
                    // 1. Create a map of entity_id -> buffer_offset
                    const entityMap = new Map();
                    const len = buffer.length;
                    for (let i = 0; i < len; i += RENDER_STRIDE) {
                        const id = buffer[i];
                        entityMap.set(id, i);
                    }

                    // 2. Update brush states first
                    for (let i = 0; i < len; i += RENDER_STRIDE) {
                        const id = buffer[i];
                        const brushDown = buffer[i + 10] > 0.5;
                        // Color is handled by JsAction, stored in state
                        const brushSize = buffer[i + 11];
                        const brushTransparency = buffer[i + 12];
                        const fillDown = buffer[i + 13] > 0.5;
                        // FillColor is handled by JsAction
                        // FillTransparency is buffer[i + 14]

                        const brushState = this.getBrushState(id);
                        brushState.down = brushDown;
                        brushState.size = brushSize;
                        brushState.opacity = brushTransparency;
                        brushState.fillDown = fillDown;
                        // brushState.lastX/Y updated in handleBrushPath
                    }

                    // 3. Draw in reverse entity order (z-index)
                    for (let i = this.entityOrder.length - 1; i >= 0; i--) {
                        const entityId = this.entityOrder[i];
                        const offset = entityMap.get(entityId);

                        // Draw brush layer
                        const brushCanvas = this.brushCanvases.get(entityId);
                        if (brushCanvas) {
                            this.ctx.drawImage(brushCanvas, 0, 0);
                        }

                        // Draw entity if present in render buffer (visible)
                        if (offset !== undefined) {
                            this.drawEntityFromBuffer(buffer, offset);
                        }
                    }

                    // 4. Draw fill preview
                    if (this.fillCanvas) {
                        this.ctx.drawImage(this.fillCanvas, 0, 0);
                    }
                }

                drawEntityFromBuffer(buffer, offset) {
                    // Extract data from buffer
                    const x = buffer[offset + 1];
                    const y = buffer[offset + 2];
                    const rotation = buffer[offset + 3];
                    // direction at +4
                    const scaleX = buffer[offset + 5];
                    const scaleY = buffer[offset + 6];
                    const width = buffer[offset + 7];
                    const height = buffer[offset + 8];
                    const visible = buffer[offset + 9] > 0.5;
                    // brush/fill props...

                    if (!visible) return;

                    this.ctx.save();

                    // Transform to Entry coordinate system (center is 0,0)
                    this.ctx.translate(240 + x, 180 - y);
                    this.ctx.rotate((-rotation * Math.PI) / 180);
                    this.ctx.scale(scaleX, scaleY);

                    // We need pictureId to draw the image.
                    // Buffer doesn't contain pictureId (string).
                    // We need to look it up from the entity object in JS memory.
