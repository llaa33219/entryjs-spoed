worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # WASM MIME type
    types {
        application/wasm wasm;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # CORS headers for playentry.org API calls
        location / {
            try_files $uri $uri/ /index.html;
            
            # CORS headers
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,CSRF-Token';
            
            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm)$ {
                expires 1d;
                add_header Cache-Control "public, immutable";
            }
        }

        # Health check endpoint for Railway
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Proxy for playentry.org API (to avoid CORS issues)
        location /api/playentry/ {
            proxy_pass https://playentry.org/;
            proxy_ssl_server_name on;
            proxy_set_header Host playentry.org;
            proxy_set_header Origin https://playentry.org;
            proxy_set_header Referer https://playentry.org/;
            proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64; rv:146.0) Gecko/20100101 Firefox/146.0";
            proxy_set_header Accept "*/*";
            proxy_set_header Accept-Language "ko-KR,ko;q=0.9,en-US;q=0.8,en;q=0.7";
            proxy_set_header x-client-type "Client";
            proxy_set_header Sec-Fetch-Dest "empty";
            proxy_set_header Sec-Fetch-Mode "cors";
            proxy_set_header Sec-Fetch-Site "same-origin";
            
            # Pass through client headers
            proxy_pass_request_headers on;
            
            # Handle preflight OPTIONS requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*';
                add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,CSRF-Token,x-client-type';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }
            
            # CORS headers for actual requests
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,CSRF-Token,x-client-type' always;
        }
    }
}
